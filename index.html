<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f2937" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#05070a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Einkaufsliste</title>
<style>
:root{color-scheme:light dark;--bg:#f4f4f2;--card:#fff;--fg:#1f2937;--hdr:#1f2937;--mute:#6b7280;--line:#e5e7eb;--acc:#f5c400;--ok:#16a34a;--btn2:#e5e7eb;--stepbg:#f3f4f6;--panel:#e9ecf1;--ts:80%;--tl:89%;--onbg:#d1fae5;--onfg:#065f46;--tab:#374151;--tabfg:#d1d5db}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1115;--card:#1b1f27;--fg:#e5e7eb;--hdr:#05070a;--mute:#9ca3af;--line:#2d333d;--btn2:#2d333d;--stepbg:#262b34;--panel:#151920;--ts:38%;--tl:24%;--onbg:#064e3b;--onfg:#a7f3d0;--tab:#1b1f27;--tabfg:#9ca3af}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0f1115;--card:#1b1f27;--fg:#e5e7eb;--hdr:#05070a;--mute:#9ca3af;--line:#2d333d;--btn2:#2d333d;--stepbg:#262b34;--panel:#151920;--ts:38%;--tl:24%;--onbg:#064e3b;--onfg:#a7f3d0;--tab:#1b1f27;--tabfg:#9ca3af}
:root[data-theme=light]{color-scheme:light}
button,input,select{color:var(--fg);font-family:inherit}
input,select{background:var(--card)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--hdr);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 8px 0}
.top{display:flex;align-items:flex-end;gap:4px;max-width:616px;margin:0 auto}
.cart{flex:none;border:0;background:none;font-size:24px;padding:0 2px 8px;line-height:1}
.cart.on{filter:drop-shadow(0 0 6px #f7c600)}
nav{display:flex;gap:3px;overflow-x:auto;flex:1;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;border:0;border-radius:9px 9px 0 0;padding:10px 5px;font-size:13px;font-weight:600;background:var(--tab);color:var(--tabfg);white-space:nowrap}
nav button.info{flex:0 0 auto;font-size:15px;padding:9px 7px}
nav .n{margin-left:3px;padding:0 5px;min-width:16px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--hdr);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw;box-shadow:0 4px 18px rgba(0,0,0,.3);transition:opacity .3s}

nav button.on{background:var(--bg);color:var(--fg)}
nav .n{display:inline-block;min-width:20px;margin-left:4px;padding:0 6px;border-radius:10px;background:var(--acc);color:#111;font-size:12px}
main{padding:12px;max-width:640px;margin:0 auto}
.add{display:flex;gap:6px;position:sticky;top:0}
.add input{flex:1;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.sugg{background:var(--card);border-radius:10px;margin-top:6px;box-shadow:0 4px 14px rgba(0,0,0,.08);overflow:hidden}
.sugg div{padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.sugg div:last-child{border:0}
.sugg small,.item small{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:6px 10px;font-size:14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:18px 4px 6px}
.swipe{position:relative;margin-bottom:3px;border-radius:8px;overflow:hidden}
.swipe>.sw-del,.swipe>.sw-ok{position:absolute;inset:0;display:none;align-items:center;padding:0 14px;font-weight:700;color:#fff;font-size:14px}
.swipe>.sw-del{background:#dc2626;justify-content:flex-start}
.swipe>.sw-ok{background:var(--ok);justify-content:flex-end}
.swipe.to-del>.sw-del,.swipe.to-ok>.sw-ok{display:flex}
.swipe.to-del:not(.armed)>.sw-del,.swipe.to-ok:not(.armed)>.sw-ok{opacity:.6}
.item{position:relative;touch-action:pan-y;display:flex;align-items:center;gap:9px;background:var(--card);padding:6px 10px 6px 12px;border-radius:8px;margin-bottom:0;cursor:pointer;user-select:none;font-size:15px;min-height:40px}
.item.done{opacity:.55}
.item.done .t{text-decoration:line-through}
.item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--mute);font-size:13px}
.item .x{border:0;background:none;color:var(--mute);font-size:18px;padding:0 6px}
.qty{font-weight:700;margin-right:2px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:600;background:var(--ok);color:#fff;margin-top:14px}
.btn.sec{background:var(--btn2);color:var(--fg)}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.setup{background:var(--card);border-radius:12px;padding:16px}
.setup label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.setup input{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px}
.err{color:#b91c1c;margin-top:10px;white-space:pre-wrap;font-size:13px}
dialog{border:0;border-radius:14px;padding:16px;width:min(92vw,420px);background:var(--card);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog input,dialog select{width:100%;font-size:16px;padding:10px;margin:4px 0 10px;border:1px solid var(--line);border-radius:8px}
dialog label{font-size:13px;color:var(--mute)}
.row{display:flex;gap:8px}
.tile.saleTile .e{font-weight:800;color:#b45309}
.tile.saleTile{background:#fff3c4;border:2px solid #f5c542}
[data-theme=dark] .tile.saleTile{background:#3d3210;border-color:#8a6d12}
[data-theme=dark] .tile.saleTile .e{color:#fbbf24}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:12px}
.tile{position:relative;background:var(--card);border:0;border-radius:14px;padding:14px 6px 10px;text-align:center;font-size:13px;font-weight:600;color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.06);min-height:96px}
.tile .e{display:block;font-size:34px;line-height:1.2;margin-bottom:4px}
.tile .n{position:absolute;top:6px;right:6px;min-width:20px;padding:0 6px;border-radius:10px;background:var(--acc);color:#111;font-size:12px}
.ghead{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.ghead button{border:0;background:var(--card);color:var(--fg);border-radius:10px;padding:8px 12px;font-size:16px}
.ghead h3{margin:0;font-size:19px;flex:1}
.prow{display:flex;align-items:center;gap:8px;background:var(--card);padding:8px 8px 8px 10px;border-radius:10px;margin-bottom:5px}
.prow .t{flex:1;min-width:0}
.prow small{color:var(--mute)}
.prow .on{display:inline-block;margin-top:2px;font-size:12px;color:var(--onfg);background:var(--onbg);border-radius:8px;padding:0 6px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none;background:var(--card)}
.step button{border:0;background:var(--stepbg);width:38px;height:38px;font-size:20px;font-weight:700}
.step span{min-width:44px;text-align:center;font-weight:700;line-height:1.1;padding:0 2px}.step span small{display:block;font-size:10px;font-weight:600;color:var(--mute)}
.prow .t[data-edit]{cursor:pointer}
.send{border:0;border-radius:10px;height:40px;padding:0 10px;font-size:14px;font-weight:700;color:#fff;flex:none;min-width:74px}
.send.edeka{background:#d4a800;color:#111}.send.budni{background:#1b3f8b}.send.tibarg{background:#0e7490}.send.baumarkt{background:#c2410c}.send.sonstiges{background:#6b7280}.send.none{background:#9ca3af;color:#111}
.send.onl{background:var(--btn2);color:var(--fg)}
.send.upd{outline:3px solid #16a34a55}
.add .scanb{flex:none;border:0;border-radius:10px;background:var(--hdr);color:#fff;width:52px;display:grid;place-items:center}
#fScan svg{vertical-align:-4px;margin-right:4px}
dialog.scan{padding:0;width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0;background:#000;color:#fff}
dialog.scan video{width:100%;height:100%;object-fit:cover}
.scanFrame{position:fixed;left:8%;right:8%;top:35%;height:22%;border:3px solid #f7c600;border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);pointer-events:none}
.scanBar{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.torch{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;width:52px;height:52px;border-radius:50%;border:0;background:rgba(0,0,0,.55);font-size:24px}
.torch.on{background:#f7c600}
#scanLog{font-size:14px;margin-bottom:6px;text-align:left;max-width:420px;margin-inline:auto}
#scanLog div{padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.12);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scanBar button{margin-top:10px;border:0;border-radius:10px;padding:12px 28px;font-size:16px;font-weight:600}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:#fde68a}}
#fAssBox{background:var(--stepbg);border-radius:10px;padding:8px 10px;margin-bottom:10px}
#fAssList{max-height:190px;overflow-y:auto}
#fAssList button{display:block;width:100%;text-align:left;border:0;border-radius:6px;background:var(--card);padding:5px 7px;margin-bottom:2px;font-size:12px;line-height:1.2}
#fAssBox,#fAssBox label,#fAssBox small{font-size:12px}
#fAssList button small{color:var(--mute)}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 6px;font-size:15px;font-weight:600}
.seg button.on{background:var(--hdr);color:#fff;border-color:var(--hdr)}
.seg button.zbtn{flex:0 0 auto;padding:12px 10px}
.seg button{white-space:nowrap;font-size:14px;padding:12px 4px}
.nimg{display:block;width:100%;border-radius:8px;margin:6px 0 4px;background:var(--line);min-height:60px;cursor:zoom-in}
#imgView{position:fixed;inset:0;background:#000d;z-index:50;overflow:auto;display:flex;align-items:flex-start;justify-content:center}
#imgView img{width:100%;max-width:1200px;touch-action:pinch-zoom}
.toplist{background:var(--panel);border-radius:12px;padding:8px;margin-bottom:8px}
.tophead{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px;font-size:13px;font-weight:600;color:var(--mute)}
.tophead button{border:0;background:var(--hdr);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
.prow .hits{flex:none;min-width:18px;font-size:12px;font-weight:700;color:var(--mute);text-align:center}
.stats div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.item.tint,.prow.tint{background:hsl(var(--h) var(--ts) var(--tl))}
.scard{background:var(--panel);border-radius:12px;padding:8px;margin-bottom:10px}
.shead{display:flex;align-items:center;gap:8px;padding:2px 4px 8px;font-size:16px}
.shead .cnt{min-width:20px;padding:0 6px;border-radius:10px;background:var(--acc);color:#111;font-size:12px;text-align:center}
.shead .del{border:0;background:none;font-size:18px;padding:2px 6px;opacity:.75;color:var(--fg)}
.shead[data-ox],.shead[data-nz]{cursor:pointer;padding-bottom:2px}
.scard.open .shead,.scard.note .shead{padding-bottom:8px}
.shead .chev{width:14px;color:var(--mute);font-size:14px}
.shead .ydot{width:9px;height:9px;border-radius:50%;background:var(--acc)}
.scard .sbody{padding:0 2px 2px}
.nbody{white-space:pre-wrap;padding:2px 6px 6px;font-size:15px;line-height:1.4}
.scard.note input,.scard.note textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);margin-bottom:8px;box-sizing:border-box}
.scard.note #nT{font-weight:600}
.send{background:#7c3aed}
nav button{position:relative}
nav .tl{display:inline-grid;place-items:center;width:28px;height:24px;border-radius:6px;font-weight:900;font-size:19px;line-height:1;font-family:Arial Black,Arial,sans-serif}
nav .tl-e{background:#f7c600;color:#111;font-size:15px;width:28px;height:24px;border-radius:6px}
nav .tl-b{font-size:15px}
nav .tl-b{background:#1d4fa8;color:#fff}
nav button:has(.tl){padding:7px 8px}
nav .dot{position:absolute;top:5px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 1.5px var(--hdr)}
nav button.on .dot{box-shadow:0 0 0 1.5px var(--bg)}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0 4px}
.qrbox .qr{background:#fff;padding:8px;border-radius:12px;line-height:0}
.qrbox .qr svg{width:190px;height:190px}
.qrbox a{color:var(--fg);font-size:14px;word-break:break-all}
.hint{color:var(--mute);font-size:13px}
.fam{display:flex;align-items:center;gap:8px;background:var(--stepbg);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.fam span{flex:1;min-width:0}
.fam button{border:0;border-radius:8px;background:var(--btn2);padding:8px 10px;font-size:13px;font-weight:600}
.fam .btn{background:var(--ok);color:#fff;font-size:15px}
.fam .btn.sec{background:var(--btn2);color:var(--fg)}
.fam button#invAdd{white-space:nowrap}
.rv{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;background:var(--stepbg);margin-bottom:4px;font-size:14px}
.rv .t{flex:1;min-width:0}
.rv small{color:var(--mute);font-size:12px}
.rv.warn{background:#fef3c7;color:#111}.rv.warn small{color:#92400e}
.rv.unk{opacity:.8}
.rv .step button{width:32px;height:32px}
.item .qty{flex:none;margin:0 2px 0 6px;font-size:14px;text-align:right;white-space:nowrap}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:10px 0 2px;color:var(--fg)}
.chk input{width:20px;height:20px;margin:0}
#fScanNew svg{vertical-align:-4px;margin-right:4px}
.newp{display:block;width:100%;text-align:left;border:0;border-radius:8px;background:var(--stepbg);padding:7px 10px;margin-bottom:4px;font-size:14px}
.newp small{color:var(--mute)}
.dlghead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dlghead h3{margin:0;flex:1;white-space:nowrap}
.bcbtn{flex:none;border:0;border-radius:10px;background:var(--hdr);color:#fff;width:48px;height:40px;display:grid;place-items:center}
.crow{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border-radius:8px;margin-bottom:3px;font-size:15px}
.crow.tint{background:hsl(var(--h) var(--ts) var(--tl))}
.crow .t{flex:1;min-width:0;cursor:pointer}
.crow small{color:var(--mute);font-size:12px}
.crow button{flex:none;border:0;background:none;font-size:17px;padding:4px 6px;opacity:.7}
.qbtn{flex:none;border:0;background:rgba(127,127,127,.14);border-radius:9px;padding:9px 10px;font-size:14px;font-weight:700;white-space:nowrap}
.cartb{position:relative;flex:none;border:0;border-radius:10px;width:46px;height:40px;display:grid;place-items:center}
.cartb.c-e{background:#f7c600;color:#111}.cartb.c-b{background:#1d4fa8;color:#fff}.cartb.c-o{background:#6b7280;color:#fff}
.cartb .ck{position:absolute;right:-5px;top:-6px;width:19px;height:19px;border-radius:50%;background:#16a34a;color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 2px var(--card)}
.wheeldlg{width:min(86vw,340px)}
.wheelbox{position:relative;height:220px}
#wheel{height:220px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
#wheel::-webkit-scrollbar{display:none}
#wheel .wpad{height:88px}
#wheel .wi{height:44px;line-height:44px;text-align:center;font-size:17px;scroll-snap-align:center;color:var(--mute);cursor:pointer}
#wheel .wi.sel{color:var(--fg);font-weight:800;font-size:20px}
.wsel{position:absolute;left:0;right:0;top:88px;height:44px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);pointer-events:none}
.qbtn{touch-action:none;user-select:none;-webkit-user-select:none}
.qbtn.dragging{outline:2px solid var(--acc)}
.qpop{position:fixed;transform:translate(-50%,-50%);z-index:60;background:var(--card);color:var(--fg);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.35);padding:4px 0;min-width:110px;text-align:center;pointer-events:none}
.qpop div{height:30px;line-height:30px;font-size:15px;color:var(--mute);padding:0 12px;white-space:nowrap}
.qpop div.sel{color:var(--fg);font-weight:800;font-size:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sale{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#dc2626;color:#fff;font-size:11px;font-weight:900;margin:0 5px;vertical-align:1px;flex:none}
</style>
</head>
<body>
<header>
  <div class="top"><button id="bHome" class="cart" title="Produktgruppen">🛒</button><nav id="tabs"></nav></div>
</header>
<main id="main"></main>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <div class="dlghead"><h3 id="dlgT">Neuer Artikel</h3><button type="button" class="bcbtn" id="fFoto" title="Foto aufnehmen – das Produkt wird über Nacht erkannt" hidden>📷</button><button type="button" class="bcbtn" id="fScanNew" title="Barcode scannen" hidden></button></div>
    <input type="file" id="fFotoIn" accept="image/*" capture="environment" multiple hidden>
    <div id="fAssBox" hidden>
      <small id="fEanTxt"></small>
      <label>Einem vorhandenen Produkt zuordnen – antippen:</label>
      <input id="fAssQ" placeholder="Produkt suchen…" autocomplete="off" style="font-size:14px;padding:7px 9px;margin:4px 0 6px">
      <div id="fAssList"></div>
      <label style="display:block;margin-top:6px">… oder unten als neues Produkt anlegen</label>
    </div>
    <label>Name</label><input id="fName" required>
    <label>Marke (optional)</label><input id="fMarke">
    <div class="row">
      <div style="flex:1"><label>Geschäft</label><select id="fShop"></select></div>
      <div style="flex:1"><label>Kategorie</label><input id="fKat" list="kats"></div>
    </div>
    <div class="row">
      <div style="flex:1"><label>Maßeinheit</label><select id="fEinh"></select></div>
      <div style="flex:1"><label>Packungsgröße (optional)</label><input id="fMenge" placeholder="z. B. 500 g"></div>
    </div>
    <datalist id="kats"></datalist>
    <button type="button" class="btn sec" id="fScan" hidden>Barcode diesem Produkt zuordnen</button>
    <label class="chk" id="fToListL"><input type="checkbox" id="fToList"> Gleich auf die Einkaufsliste setzen</label>
    <div class="row"><button class="btn sec" value="cancel" type="button" id="fCancel">Abbrechen</button><button class="btn" value="ok" id="fOk">Hinzufügen</button></div>
  </form>
</dialog>

<dialog id="dScan" class="scan">
  <video id="scanV" playsinline muted></video>
  <div class="scanFrame"></div>
  <button id="scanTorch" class="torch" hidden title="Taschenlampe">🔦</button>
  <div class="scanBar"><div id="scanLog"></div><div id="scanTxt">Barcode in den Rahmen halten</div><button id="scanX">Abbrechen</button></div>
</dialog>
<dialog id="dReview">
  <h3 style="margin-top:0">Gescannte Artikel</h3>
  <p class="hint" id="revHint" style="margin-top:0"></p>
  <div id="revList"></div>
  <div class="row" style="margin-top:4px"><button class="btn sec" id="revX">Verwerfen</button><button class="btn" id="revOk">Übernehmen</button></div>
</dialog>
<dialog id="dWheel" class="wheeldlg">
  <h3 id="wheelT" style="margin:0 0 8px;font-size:16px"></h3>
  <div class="wheelbox"><div id="wheel"></div><div class="wsel"></div></div>
  <div class="row" style="margin-top:8px"><button class="btn sec" id="wheelX" style="margin:0">Abbrechen</button><button class="btn" id="wheelOk" style="margin:0">OK</button></div>

<dialog id="dShop">
  <h3 style="margin-top:0">Wo gibt es das?</h3>
  <p id="dShopTxt" style="color:var(--mute);margin-top:0"></p>

<script>
"use strict";
/* App-Design: auto (wie Handy) / hell / dunkel – pro Gerät gespeichert */
const THEME_KEY='einkauf.theme';
function applyTheme(t){
  if(t==='light'||t==='dark') document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme;
  const dark=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelectorAll('meta[name=theme-color]').forEach(m=>{m.content=dark?'#05070a':'#1f2937';m.removeAttribute('media')});
}
applyTheme(localStorage.getItem(THEME_KEY)||'auto');
const LS='einkauf.cfg';
let cfg=JSON.parse(localStorage.getItem(LS)||'null');
let openX=null, editNote=null; let data=null, sha=null, shop=null, query='', busy=false, view='home', group=null, panel=null, xq=null, addingShop=false, newShopDefault=''; const cnt={};
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
let toastT=null;
function setStatus(t){
  let el=$('#toast'); if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el)}
  el.textContent=t; el.style.opacity=1; clearTimeout(toastT); toastT=setTimeout(()=>el.style.opacity=0,t.startsWith('⚠')?6000:2500);
}

/* ---------- GitHub ---------- */
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const b64enc=s=>{const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode(...b.subarray(i,i+0x8000));return btoa(r)};
const api=()=>`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path||'liste.json'}`;
const hdr=()=>({Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'});
/* Eingaben bereinigen: Leerzeichen, Zeilenumbrüche, unsichtbare Zeichen, kopierte URLs */
const clean=v=>String(v||'').replace(/[^\x21-\x7e]/g,'');
const cleanName=v=>clean(v).replace(/^https?:\/\/(www\.)?github\.com\//i,'').replace(/\.github\.io.*$/i,'').replace(/^\/+|\/+$/g,'');
/* Schrittweise Fehlersuche, falls die Verbindung scheitert */
async function diagnose(){
  const out=[];
  const t=async(label,url,auth)=>{
    try{const r=await fetch(url,auth?{headers:hdr()}:{});out.push(`${label}: ${r.status}${r.ok?' ✓':''}`);return r}
    catch(e){out.push(`${label}: ${e.name} – ${e.message}`);return null}
  };
  out.push(`Benutzer „${cfg.owner}“, Repo „${cfg.repo}“, Datei „${cfg.path}“`);
  out.push(`Schlüssel: ${cfg.token.length} Zeichen, beginnt mit „${cfg.token.slice(0,11)}“`);
  await t('1 GitHub erreichbar','https://api.github.com/rate_limit',false);
  const u=await t('2 Schlüssel gültig','https://api.github.com/user',true);
  if(u&&u.ok){try{out.push('   angemeldet als '+(await u.json()).login)}catch{}}
  await t('3 Repo sichtbar',`https://api.github.com/repos/${cfg.owner}/${cfg.repo}`,true);
  await t('4 Datei lesbar',api(),true);
  return out.join('\n');
}

async function load(){
  const r=await fetch(api()+'?t='+Date.now(),{headers:hdr()});
  if(!r.ok) throw new Error(r.status===401?'Token ungültig':r.status===404?'Repo oder Datei nicht gefunden':'Fehler '+r.status);
  const j=await r.json(); sha=j.sha; data=JSON.parse(b64dec(j.content));
  data.liste??=[]; data.historie??=[]; data.notizen??=[]; mergeDupes(data);
  /* alte App-Versionen legten „Tibarg“ wieder an – leeren Eintrag entfernen */
  data.geschaefte=data.geschaefte.filter(g=>g.id!=='tibarg'||data.katalog.some(p=>p.geschaeft==='tibarg'));
  /* fehlende Geschäfte ergänzen, feste Reihenfolge */
  for(const [id,name] of [['edeka','Edeka'],['budni','Budni']]) if(!data.geschaefte.some(g=>g.id===id)) data.geschaefte.push({id,name});
  /* weitere Geschäfte nur einmal anlegen – danach entscheidet die Familie über + und Papierkorb */
  if(!data.weitereAngelegt){
    for(const [id,name] of [['baumarkt','Baumarkt'],['sonstiges','Sonstiges']]) if(!data.geschaefte.some(g=>g.id===id)) data.geschaefte.push({id,name});
    data.weitereAngelegt=true;
  }
  data.geschaefte.sort((a,b)=>{const i=x=>{const k=CORE.indexOf(x.id);return k<0?99:k};return i(a)-i(b)});
}
async function save(msg){
  const r=await fetch(api(),{method:'PUT',headers:hdr(),body:JSON.stringify({message:msg+' ('+(cfg.name||'?')+')',content:b64enc(JSON.stringify(data,null,1)),sha})});
  if(r.status===409||r.status===422) return false;
  if(!r.ok) throw new Error('Speichern fehlgeschlagen: '+r.status);
  sha=(await r.json()).content.sha; return true;
}
/* Änderung anwenden; bei Konflikt neu laden und erneut anwenden */
/* Jede Aktion: sofort anzeigen, dann frischen Stand holen, Änderung darauf anwenden und speichern */
/* Aktionen werden sofort angezeigt und in einer Warteschlange nacheinander gespeichert –
   schnelle Folgen (z. B. mehrfaches Wischen) gehen nicht verloren; bei Konflikt neu laden und erneut anwenden,
   bei Netzfehlern bis zu fünfmal neu versuchen */
const ops=[]; let worker=null, lastSave=0;
function change(msg,fn){
  return new Promise(res=>{
    try{fn(data)}catch(e){console.error(e)}
    render();
    ops.push({msg,fn,res});
    if(!worker) worker=work();
  });
}
async function work(){
  busy=true;
  try{
    while(ops.length){
      const batch=ops.splice(0);
      const msg=batch.length>1?`${batch.length} Änderungen: `+batch.map(o=>o.msg).join('; ').slice(0,180):batch[0].msg;
      let ok=false;
      for(let i=0;i<6&&!ok;i++){
        try{
          ok=await save(msg);
          if(!ok){await load();for(const o of [...batch,...ops])o.fn(data);render()}
        }catch(e){if(i===5)throw e;await sleep(700*(i+1))}
      }
      if(!ok) throw new Error('Konflikt – bitte neu laden');
      lastSave=Date.now();
      batch.forEach(o=>o.res());
    }
  }catch(e){
    setStatus('⚠︎ Speichern fehlgeschlagen – bitte neu laden ('+e.message+')');
    ops.splice(0).forEach(o=>o.res());
    try{await load();render()}catch{}
  }finally{busy=false;worker=null}
}
/* Aktualisieren beim Öffnen/Zurückkehren und beim Wechseln der Ansicht */
/* Produkte, die 9 Monate lang weder gekauft noch auf eine Liste gesetzt noch neu angelegt wurden, aus dem Katalog entfernen.
   Ausgangsdatum für den ursprünglichen Katalog: 20.11.2026. Läuft höchstens einmal im Monat pro Gerät. */
const PRUNE_KEY='einkauf.aufgeraeumt', KATALOG_START='2026-11-20';
function lastActivity(d,id){
  let t=d.katalog.find(p=>p.id===id)?.angelegt||KATALOG_START;
  for(const h of d.historie) if(h.id===id&&h.datum>t) t=h.datum;
  for(const l of d.liste) if(l.id===id&&l.am&&l.am>t) t=l.am;
  return t;
}
async function pruneCatalog(){
  if(!data||localStorage.getItem(PRUNE_KEY)===today().slice(0,7)) return;
  const cut=new Date(); cut.setMonth(cut.getMonth()-9); const c=cut.toISOString().slice(0,10);
  const old=d=>d.katalog.filter(p=>!d.liste.some(l=>l.id===p.id)&&lastActivity(d,p.id)<c).map(p=>p.id);
  const ids=old(data);
  localStorage.setItem(PRUNE_KEY,today().slice(0,7));
  if(!ids.length) return;
  await change(`${ids.length} Produkte nach 9 Monaten ohne Kauf entfernt`,d=>{const del=new Set(old(d));d.katalog=d.katalog.filter(p=>!del.has(p.id));for(const r of Object.values(d.reihenfolge||{}))for(const id of del)delete r[id]});
  setStatus(`${ids.length} lange nicht gekaufte Produkte aus dem Katalog entfernt`);
}
async function refresh(){
  if(busy||!cfg||Date.now()-lastSave<5000) return;
  try{await load();await checkDevice();if(!document.querySelector('dialog[open]')&&!editNote&&!document.activeElement?.matches?.('input,textarea'))render();await autoFinish();await pruneCatalog()}
  catch(e){if(e.message==='BLOCKED')return renderBlocked();setStatus('⚠︎ '+e.message)}
}
/* ---------- Geräte: Schlüssel eines Familienmitglieds gilt nur auf einem Gerät, Administrator frei ---------- */
const DEV_KEY='einkauf.device';
const deviceId=localStorage.getItem(DEV_KEY)||(()=>{const id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));localStorage.setItem(DEV_KEY,id);return id})();
let myHash=null, myRole=null;
async function tokHash(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].slice(0,12).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function checkDevice(){
  myHash=await tokHash(cfg.token);
  const g=data.geraete||{}, e=g[myHash];
  if(e){
    myRole=e.rolle;
    if(e.rolle!=='admin'&&e.geraet!==deviceId) throw new Error('BLOCKED');
    return;
  }
  /* erster Start mit diesem Schlüssel: der allererste wird Administrator, alle weiteren Familienmitglieder */
  myRole=Object.values(g).some(x=>x.rolle==='admin')?'mitglied':'admin';
  const h=myHash, role=myRole, name=cfg.name||'?';
  await change('Gerät angemeldet: '+name,d=>{d.geraete??={};if(!d.geraete[h])d.geraete[h]={name,rolle:role,geraet:deviceId,seit:today()}});
}
function renderBlocked(){
  data=null; localStorage.removeItem(LS);
  $('#tabs').innerHTML='';
  $('#main').innerHTML=`<div class="setup"><h3 style="margin-top:0">🔒 Schlüssel bereits vergeben</h3>
    <p>Dieser Schlüssel ist schon auf einem anderen Gerät angemeldet und kann hier nicht verwendet werden.</p>
    <p class="hint">Bei einem neuen Handy kann der Administrator das alte Gerät unter ⓘ → Familie freigeben.</p>
    <button class="btn" id="bAgain">Anderen Schlüssel eingeben</button></div>`;
  cfg=null; $('#bAgain').onclick=renderSetup;
}

/* ---------- Logik ---------- */
const prod=id=>data.katalog.find(p=>p.id===id);
const label=p=>p.marke?`${p.marke} ${p.name}`:p.name;
function freq(){const f={};for(const h of data.historie)f[h.id]=(f[h.id]||0)+1;return f}
function lastBought(id){let d='';for(const h of data.historie)if(h.id===id&&h.datum>d)d=h.datum;return d}
function shopItems(s){return data.liste.filter(l=>{const p=prod(l.id);return p&&p.geschaeft===s})}

/* Pro Produkt gibt es höchstens einen Listeneintrag. Ist er schon abgehakt und wird erneut etwas gewünscht,
   wird er wieder geöffnet (Menge = neue Gesamtmenge). Ältere Doppeleinträge werden beim Laden zusammengeführt. */
function putOnList(d,id,f){
  const e=d.liste.find(l=>l.id===id);
  if(e){f(e);if(e.erledigt){e.erledigt=false;delete e.um}}
  else{const n={id,anzahl:0,von:cfg.name||'',am:today(),ts:Date.now()};f(n);d.liste.push(n)}
}
function mergeDupes(d){
  const by={};
  d.liste=d.liste.filter(l=>{
    const k=by[l.id]; if(!k){by[l.id]=l;return true}
    const neu=(l.ts||0)>=(k.ts||0)?l:k;           /* die zuletzt gesetzte Menge gilt */
    k.anzahl=neu.anzahl; if(!l.erledigt||!k.erledigt){k.erledigt=false;delete k.um}
    if(neu===l){k.von=l.von;k.am=l.am;k.ts=l.ts}
    return false;
  });
}
function addItem(id){
  change('+ '+label(prod(id)),d=>{
    putOnList(d,id,e=>{e.anzahl=e.anzahl?(e.erledigt?e.anzahl:e.anzahl+stepOf(prod(id))):suggest(id)});
  });
  query='';
}
/* Laufweg: Startreihenfolge aus den Gängen des Geschäfts, danach gelernt aus der Abhak-Reihenfolge */
function defRank(d,s,p){
  const g=d.geschaefte.find(x=>x.id===s)?.gaenge||[];
  let i=g.indexOf(p.kategorie);
  if(i<0) i=g.length+[...new Set(d.katalog.map(x=>x.kategorie))].sort((a,b)=>a.localeCompare(b,'de')).indexOf(p.kategorie);
  return i*10000+d.katalog.findIndex(x=>x.id===p.id);
}
const rankOf=(d,s,p)=>d.reihenfolge?.[s]?.[p.id]??defRank(d,s,p);
function toggle(id){
  const t=Date.now();
  const v=!data.liste.find(l=>l.id===id)?.erledigt;
  change((v?'✓ ':'↺ ')+label(prod(id)),d=>{for(const e of d.liste)if(e.id===id){e.erledigt=v;if(v)e.um=t;else delete e.um}});
}
/* „Alles eingekauft“: alle offenen Artikel abhaken (in Laufweg-Reihenfolge, damit die gelernte Reihenfolge erhalten bleibt)
   und den Einkauf sofort abschließen */
async function allBought(s){
  const open=shopItems(s).filter(l=>!l.erledigt).sort((a,b)=>rankOf(data,s,prod(a.id))-rankOf(data,s,prod(b.id))).map(l=>l.id);
  const all=shopItems(s).length; if(!all) return;
  const t=Date.now();
  if(open.length) change(`Alles eingekauft (${shopName(s)})`,d=>{open.forEach((id,i)=>{for(const e of d.liste)if(e.id===id&&!e.erledigt){e.erledigt=true;e.um=t+i}})});
  await finish(s);
}
function remove(id){change('− '+label(prod(id)),d=>{d.liste=d.liste.filter(l=>l.id!==id)})}
function finish(s=shop,auto=false){
  const n=shopItems(s).filter(l=>l.erledigt).length; if(!n) return;
  return change(`${auto?'Automatisch abgeschlossen':'Einkauf'} ${shopName(s)}: ${n} Artikel`,d=>{
    const done=d.liste.filter(l=>l.erledigt&&prod(l.id)?.geschaeft===s);
    /* Die abgehakten Artikel tauschen ihre Plätze im Laufweg so, dass sie der tatsächlichen Abhak-Reihenfolge entsprechen */
    const seq=[...done].sort((a,b)=>(a.um||0)-(b.um||0)).map(l=>d.katalog.find(x=>x.id===l.id)).filter(Boolean);
    if(seq.length>1){
      const slots=seq.map(p=>rankOf(d,s,p)).sort((a,b)=>a-b);
      d.reihenfolge??={}; d.reihenfolge[s]??={};
      seq.forEach((p,i)=>d.reihenfolge[s][p.id]=slots[i]);
    }
    for(const l of done) d.historie.push({id:l.id,datum:l.um?new Date(l.um).toISOString().slice(0,10):today(),anzahl:l.anzahl||1,wer:cfg.name||''});
    d.liste=d.liste.filter(l=>!done.includes(l));
  });
}
const AUTO_MS=60*60*1000;
async function autoFinish(){
  if(!data) return;
  for(const s of SHOPS()){
    const done=shopItems(s).filter(l=>l.erledigt); if(!done.length) continue;
    const last=Math.max(...done.map(l=>l.um||0));
    if(Date.now()-last>AUTO_MS){await finish(s,true);setStatus(`Einkauf ${shopName(s)} automatisch abgeschlossen`)}
  }
}
function newProduct(toList=true){
  const defShop=newShopDefault||(view==='shop'?shop:view==='extra'&&openX?openX:''); newShopDefault='';
  $('#fShop').innerHTML=`<option value="">– bitte wählen –</option>`+data.geschaefte.filter(g=>SHOPS().includes(g.id)).map(g=>`<option value="${g.id}" ${g.id===defShop?'selected':''}>${esc(g.name)}</option>`).join('');
  $('#kats').innerHTML=[...new Set(data.katalog.map(p=>p.kategorie))].map(k=>`<option value="${esc(k)}">`).join('');
  $('#fName').value=query;$('#fMarke').value='';$('#fKat').value=view==='group'?group:'';$('#fMenge').value='';
  $('#fEinh').innerHTML=Object.keys(EINH).map(u=>`<option>${u}</option>`).join('');$('#fEinh').value='Stück';
  editId=null;scanEan=null;$('#dlgT').textContent='Neuer Artikel';$('#fOk').textContent=toList?'Hinzufügen':'Anlegen';$('#fAssBox').hidden=true;$('#fScan').hidden=true;
  $('#fScanNew').hidden=false;$('#fScanNew').innerHTML=BC_ICON;$('#fFoto').hidden=false;$('#fToListL').hidden=false;$('#fToList').checked=toList;
  $('#dlg').showModal();
}
$('#fCancel').onclick=()=>$('#dlg').close();
/* Foto statt Eintippen: Foto wird hochgeladen, die abendliche Aufgabe legt das Produkt an */
$('#fFoto').onclick=()=>$('#fFotoIn').click();
$('#fFotoIn').onchange=async e=>{
  const files=[...e.target.files]; e.target.value=''; if(!files.length) return;
  $('#dlg').close(); let ok=0;
  for(const f of files){setStatus(`Foto ${ok+1}/${files.length} wird hochgeladen…`);try{await uploadPhoto(f);ok++}catch(err){setStatus('⚠︎ '+err.message);break}}
  if(ok){
    setStatus(`${ok} Foto${ok>1?'s':''} hochgeladen – ab morgen im Katalog`);
    if(!localStorage.getItem('einkauf.fotoHinweis')){localStorage.setItem('einkauf.fotoHinweis','1');
      alert('Danke! Fotos werden einmal täglich abends ausgewertet.\nDas Produkt ist am Folgetag im Katalog.')}
  }
  showPending();
};
$('#fScanNew').onclick=async()=>{
  const keep={n:$('#fName').value,m:$('#fMarke').value,k:$('#fKat').value,s:$('#fShop').value,e:$('#fEinh').value,g:$('#fMenge').value,t:$('#fToList').checked};
  $('#dlg').close();

  await fillFromCode(code,true);
};
let editId=null;
function editProduct(id){

  editId=id;$('#dlgT').textContent='Artikel bearbeiten';$('#fOk').textContent='Speichern';

$('#fScan').onclick=async()=>{
  const id=editId; $('#dlg').close();

};
async function assignTo(id){const code=scanEan,toList=$('#fToList').checked;if(!id||!code)return;$('#dlg').close();await addEan(id,code);if(!toList){setStatus('Barcode zugeordnet: '+label(prod(id)));if(view==='info')render();return}await send(id);setStatus('Zugeordnet und auf die Liste gesetzt')}
let assInfo=null;
function renderAssList(){
  const q=$('#fAssQ').value.trim().toLowerCase();
  let list;
  if(q){const ws=q.split(/\s+/);list=data.katalog.filter(p=>{const t=(label(p)+' '+p.kategorie).toLowerCase();return ws.every(w=>t.includes(w))}).slice(0,30).map(p=>({p,s:0}))}
  else list=similar(assInfo).filter(x=>x.s>0).slice(0,8);

  $('#fAssList').querySelectorAll('[data-ass]').forEach(b=>b.onclick=()=>assignTo(b.dataset.ass));

$('#fAssQ').oninput=renderAssList;
$('#dlgForm').onsubmit=e=>{
  e.preventDefault();
  const name=$('#fName').value.trim(); if(!name) return;
  if(editId){
    const id=editId,v={name,marke:$('#fMarke').value.trim(),kategorie:$('#fKat').value.trim()||'Sonstiges',einheit:$('#fEinh').value,menge:$('#fMenge').value.trim(),geschaeft:$('#fShop').value};
    $('#dlg').close();editId=null;
    change('Bearbeitet: '+name,d=>{const x=d.katalog.find(x=>x.id===id);if(!x)return;Object.assign(x,v);if(!x.menge)delete x.menge;if(!x.geschaeft)x.geschaeft='sonstiges';});
    return;
  }
  const p={id:'p'+Date.now().toString(36),name,marke:$('#fMarke').value.trim(),kategorie:$('#fKat').value.trim()||'Sonstiges',geschaeft:$('#fShop').value,einheit:$('#fEinh').value};
  const mg=$('#fMenge').value.trim(); if(mg) p.menge=mg;
  if(scanEan) p.eans=[scanEan];
  p.angelegt=today();
  const toList=$('#fToList').checked;
  $('#dlg').close(); query='';
  (async()=>{
    if(!p.geschaeft){p.geschaeft=await askShop(p);if(!p.geschaeft)return}
    await change('Neu: '+label(p),d=>{

};

function guessUnit(p){
  const t=(p.name+' '+(p.marke||'')+' '+(p.menge||'')).toLowerCase(), k=p.kategorie;
  const has=(...w)=>w.some(x=>t.includes(x));

  if(['Tiefkühl','Süßes & Snacks','Backen','Nudeln & Reis','Brot'].includes(k)) return 'Packung';
  if(has('glasreiniger')) return 'Flasche';
  if(has('riegel','rasierklingen')) return 'Packung';
  if(has('kiwi','maiskolben')) return 'Packung';
  if(has('tube','zahncreme','tomatenmark','mayonnaise','rasiercreme','handcreme','hand- & nagel','gelée','fluoridgel')) return 'Tube';
  if(has('dose','mandarin','pfirsich','goldmais','nivea creme')) return 'Dose';
  if(has('glas','gurken','pesto','basilico','passata','sauerkraut','apfelmus','konfitüre','honig','crunchy cream','pickles','bambus','knoblauch','tomaten fein')) return 'Glas';
  if(has('becher','crème fraîche','sanella','streichzarte','frischkäse','kräuter-frischkäse','miree')) return 'Becher';
  if(has('pils','radler','öl','saft','ketchup','sauce','aceto','balsamico','shampoo','spülung','dusch','lotion','mundspülung','reiniger','weichspüler','spüler','scheuermilch','parkettpflege','fleckentferner','perwoll','coral','sagrotan','intimate','nagellack','rohrfrei','backofen','schimmel','pflege-öl','reinigungsmilch')) return 'Flasche';
  if(has('äpfel','orangen','karotten')) return 'kg';

  if(['Obst & Gemüse','Gesicht','Kosmetik','Herren'].includes(k)) return 'Stück';
  return 'Packung';
}

/* Mengen-Walze */
function wheelValues(p){
  const st=stepOf(p), max=st===100?5000:st===0.5?20:50, v=[];
  for(let x=st;x<=max+1e-9;x=Math.round((x+st)*100)/100) v.push(x);
  return v;
}
function pickQty(p,cur){
  return new Promise(res=>{
    const dl=$('#dWheel'), w=$('#wheel'), vals=wheelValues(p), H=44;
    if(!vals.includes(cur)) vals.push(cur), vals.sort((a,b)=>a-b);
    $('#wheelT').textContent=label(p);
    vals.reverse(); /* größte Werte oben: nach unten ziehen = mehr */
    w.innerHTML='<div class="wpad"></div>'+vals.map(v=>`<div class="wi">${fmtQ(p,v)}</div>`).join('')+'<div class="wpad"></div>';
    const items=[...w.querySelectorAll('.wi')];
    const idx=()=>Math.max(0,Math.min(vals.length-1,Math.round(w.scrollTop/H)));
    const mark=()=>{const k=idx();items.forEach((el,i)=>el.classList.toggle('sel',i===k))};
    w.onscroll=mark;
    items.forEach((el,i)=>el.onclick=()=>w.scrollTo({top:i*H,behavior:'smooth'}));
    const done=v=>{dl.close();res(v)};
    $('#wheelOk').onclick=()=>done(vals[idx()]);
    $('#wheelX').onclick=()=>done(null);
    dl.oncancel=ev=>{ev.preventDefault();done(null)};
    dl.showModal();
    w.scrollTop=vals.indexOf(cur)*H; mark();
  });
}
/* Menge direkt am Feld drehen: Finger auflegen und nach oben/unten ziehen; kurzes Tippen öffnet die große Walze */
function bindQtyDrag(btn){
  const id=btn.dataset.q;
  btn.onpointerdown=ev=>{
    const p=prod(id), vals=wheelValues(p), e=openEntry(id);
    const start=cnt[id]??(e?.anzahl||suggest(id));
    if(!vals.includes(start)) vals.push(start), vals.sort((a,b)=>a-b);
    let i0=vals.indexOf(start), i=i0, y0=ev.clientY, moved=false;
    btn.setPointerCapture(ev.pointerId);
    const pop=document.createElement('div'); pop.className='qpop';
    const r=btn.getBoundingClientRect();
    pop.style.left=(r.left+r.width/2)+'px'; pop.style.top=(r.top+r.height/2)+'px';
    const draw=()=>{pop.innerHTML=[2,1,0,-1,-2].map(k=>{const v=vals[i+k];return `<div class="${k?'':'sel'}" style="opacity:${v==null?0:1-Math.abs(k)*.33}">${v==null?'&nbsp;':fmtQ(p,v)}</div>`}).join('');btn.textContent=fmtQ(p,vals[i])};
    const move=e2=>{
      const dy=e2.clientY-y0;   /* nach unten ziehen = mehr */
      if(!moved&&Math.abs(dy)<6) return;
      if(!moved){moved=true;document.body.appendChild(pop);btn.classList.add('dragging')}
      const ni=Math.max(0,Math.min(vals.length-1,i0+Math.round(dy/22)));
      if(ni!==i){i=ni;navigator.vibrate?.(8)}
      draw();
    };
    const up=()=>{
      btn.onpointermove=null;btn.onpointerup=null;btn.onpointercancel=null;
      pop.remove();btn.classList.remove('dragging');
      if(!moved) return qtyClick(id);
      const v=vals[i]; if(v===start) return;
      if(openEntry(id)){delete cnt[id];setOnList(id,v)} else {cnt[id]=v;render()}
    };
    btn.onpointermove=move; btn.onpointerup=up; btn.onpointercancel=up;
  };
}

let scanEan=null;
const BC_ICON='<svg viewBox="0 0 28 20" width="28" height="20" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="2" height="18"/><rect x="5" y="1" width="1" height="18"/><rect x="8" y="1" width="3" height="18"/><rect x="13" y="1" width="1" height="18"/><rect x="16" y="1" width="2" height="18"/><rect x="20" y="1" width="1" height="18"/><rect x="23" y="1" width="1.5" height="18"/><rect x="26" y="1" width="1" height="18"/></svg>';
const loadScript=src=>new Promise((ok,no)=>{if(window.ZXing)return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('Scanner konnte nicht geladen werden'));document.head.appendChild(s)});
/* Scanner: einzeln (liefert einen Code) oder fortlaufend (onCode für jeden Code, bis „Fertig“) */
function scanBarcode(opt={}){
  const dl=$('#dScan'), v=$('#scanV'), txt=$('#scanTxt'), torch=$('#scanTorch'), btn=$('#scanX');
  let stream=null, stop=false, zx=null, done=false, last='', lastT=0, torchOn=false;
  $('#scanLog').innerHTML=''; torch.hidden=true; torch.classList.remove('on');
  btn.textContent=opt.multi?'Fertig':'Abbrechen';
  return new Promise(res=>{
    const close=code=>{
      if(done) return; done=true; stop=true;
      try{zx&&zx.reset()}catch{}
      if(stream) stream.getTracks().forEach(t=>t.stop());
      if(v.srcObject) v.srcObject.getTracks?.().forEach(t=>t.stop());
      v.srcObject=null; if(dl.open) dl.close();
      res(code);
    };
    const hit=code=>{
      if(stop) return;
      /* derselbe Code zählt erst wieder, wenn er kurz aus dem Bild war */
      const now=Date.now(); if(code===last&&now-lastT<1500){lastT=now;return} last=code; lastT=now;
      navigator.vibrate?.(80);
      if(!opt.multi) return close(code);
      opt.onCode(code);
    };
    btn.onclick=()=>close(null);
    dl.oncancel=e=>{e.preventDefault();close(null)};
    const setupTorch=()=>{
      const tr=v.srcObject?.getVideoTracks?.()[0];
      if(!tr||!tr.getCapabilities||!tr.getCapabilities().torch) return;
      torch.hidden=false;
      torch.onclick=async()=>{torchOn=!torchOn;try{await tr.applyConstraints({advanced:[{torch:torchOn}]});torch.classList.toggle('on',torchOn)}catch{torchOn=!torchOn}};
    };
    txt.textContent='Kamera wird gestartet…'; dl.showModal();
    (async()=>{
      try{
        const cam={video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}};
        let det=null;
        if('BarcodeDetector' in window){
          try{const fm=await BarcodeDetector.getSupportedFormats();const want=['ean_13','ean_8','upc_a','upc_e','code_128'].filter(f=>fm.includes(f));if(want.length)det=new BarcodeDetector({formats:want})}catch{}
        }
        const ready=()=>{txt.textContent=opt.multi?'Artikel nacheinander in den Rahmen halten':'Barcode in den Rahmen halten';setupTorch()};
        if(det){
          stream=await navigator.mediaDevices.getUserMedia(cam); v.srcObject=stream; await v.play(); ready();
          const loop=async()=>{if(stop)return;try{const r=await det.detect(v);if(r.length)hit(r[0].rawValue)}catch{}setTimeout(loop,150)};
          loop();
        }else{
          await loadScript('zxing.min.js'); if(stop) return;
          const hints=new Map();
          hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128]);
          zx=new ZXing.BrowserMultiFormatReader(hints);
          await zx.decodeFromConstraints(cam,v,r=>{if(r)hit(r.getText())});
          ready();
        }
      }catch(e){txt.textContent=(e.name==='NotAllowedError'?'Kamera-Zugriff wurde nicht erlaubt. Bitte in den Browser-Einstellungen für diese Seite erlauben.':'Kamera nicht verfügbar: '+e.message)}
    })();
  });
}

async function lookupEan(code){

function similar(info){
  const stop=new Set(['mit','und','bio','für','der','die','das','von','ohne']);
  const words=(info?(info.name+' '+info.marke):'').toLowerCase().split(/[^a-zäöüß0-9]+/).filter(w=>w.length>2&&!stop.has(w));
  const sc=p=>{const t=label(p).toLowerCase();return words.reduce((a,w)=>a+(t.includes(w)?1:0),0)};
  return [...data.katalog].map(p=>({p,s:sc(p)})).sort((a,b)=>b.s-a.s||a.p.name.localeCompare(b.p.name,'de'));
}
/* Fortlaufend scannen: bekannte Artikel sofort auf ihre Liste, unbekannte danach nacheinander anlegen/zuordnen */
const waitClose=dl=>new Promise(r=>dl.addEventListener('close',r,{once:true}));
async function onScan(){
  /* während des Scannens nur sammeln; Duplikate werden zusammengefasst und vor dem Übernehmen geprüft */
  const counts=new Map(); let n=0;
  const log=t=>{const el=$('#scanLog');el.insertAdjacentHTML('afterbegin',`<div>${t}</div>`);while(el.children.length>4)el.lastChild.remove();$('#scanX').textContent=`Fertig (${n})`};
  await scanBarcode({multi:true,onCode:code=>{
    n++; const k=(counts.get(code)||0)+1; counts.set(code,k);
    const p=byEan(code);
    log(`${p?'✓ '+esc(label(p)):'? Barcode '+code}${k>1?` <b>(${k}× gescannt)</b>`:''}`);
  }});
  if(!counts.size) return;
  const items=[...counts].map(([code,k])=>({code,k,p:byEan(code)}));
  const ok=await reviewScan(items); if(!ok) return;
  for(const it of items){
    if(!it.p||!it.qty||!SHOPS().includes(it.p.geschaeft)) continue;
    while(busy) await sleep(100);
    const id=it.p.id, q=it.qty;
    await change('+ '+label(it.p)+' (Scan)',d=>{
      putOnList(d,id,e=>{e.anzahl=e.erledigt?q:Math.round(((e.anzahl||0)+q)*100)/100});
    });
  }
  for(const it of items){
    if(it.p&&!SHOPS().includes(it.p.geschaeft)&&it.qty){cnt[it.p.id]=it.qty;await send(it.p.id);continue}
    if(it.p) continue;
    await newFromCode(it.code);
    await waitClose($('#dlg'));
    while(busy) await sleep(100);
  }
  setStatus('Gescannte Artikel übernommen');
}
/* Prüfliste nach dem Scannen: Mehrfach-Scans und schon vorhandene Einträge hervorheben, Menge anpassbar */
function reviewScan(items){
  return new Promise(res=>{
    const dl=$('#dReview');
    for(const it of items) if(it.p) it.qty=it.k*stepOf(it.p);
    const draw=()=>{
      $('#revList').innerHTML=items.map((it,i)=>{
        if(!it.p) return `<div class="rv unk"><span class="t">Unbekannter Barcode ${it.code}${it.k>1?` · ${it.k}× gescannt`:''}<br><small>wird danach angelegt bzw. zugeordnet</small></span></div>`;
        const e=openEntry(it.p.id), notes=[];
        if(it.k>1) notes.push(`<b>${it.k}× gescannt</b>`);
        if(e) notes.push(`steht schon auf der Liste (${fmtQ(it.p,e.anzahl)})`);
        if(!SHOPS().includes(it.p.geschaeft)) notes.push('Geschäft wird danach abgefragt');
        return `<div class="rv ${it.k>1||e?'warn':''}"><span class="t">${esc(label(it.p))}${notes.length?`<br><small>${notes.join(' · ')}</small>`:''}</span>
          <div class="step"><button data-rm="${i}">−</button><span>${fmtN(it.qty)}<small>${unitOf(it.p)==='Stück'?'':unitTxt(unitOf(it.p),it.qty)}</small></span><button data-rp="${i}">+</button></div></div>`;
      }).join('');
      dl.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.rm];it.qty=Math.max(0,Math.round((it.qty-stepOf(it.p))*100)/100);draw()});
      dl.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.rp];it.qty=Math.round((it.qty+stepOf(it.p))*100)/100;draw()});
      const dup=items.filter(it=>it.k>1||(it.p&&openEntry(it.p.id))).length;
      $('#revHint').textContent=dup?`${dup} Artikel mehrfach gescannt oder schon auf der Liste – bitte Mengen prüfen (0 = nicht übernehmen).`:'Keine Duplikate gefunden.';
    };
    draw();
    $('#revOk').onclick=()=>{dl.close();res(true)};
    $('#revX').onclick=()=>{dl.close();res(false)};
    dl.oncancel=e=>{e.preventDefault();dl.close();res(false)};
    dl.showModal();
  });
}

/* Tippen oder nach links wischen = erledigt (bzw. zurück), nach rechts wischen = löschen */
function bindList(){
  $('#main').querySelectorAll('[data-t]').forEach(el=>{
    const id=el.dataset.t, wrap=el.parentElement;
    let x0=0,y0=0,dx=0,drag=false,moved=false,pid=null;
    el.onpointerdown=e=>{x0=e.clientX;y0=e.clientY;dx=0;drag=false;moved=false;pid=e.pointerId};
    el.onpointermove=e=>{
      if(pid!==e.pointerId) return;
      const ddx=e.clientX-x0, ddy=e.clientY-y0;
      if(!drag){ if(Math.abs(ddx)>10&&Math.abs(ddx)>Math.abs(ddy)*1.3){drag=true;moved=true;el.setPointerCapture(pid);el.style.transition='none'} else if(Math.abs(ddy)>10){pid=null;return} else return }
      dx=ddx; el.style.transform=`translateX(${dx}px)`;
      wrap.classList.toggle('to-del',dx>0); wrap.classList.toggle('to-ok',dx<0);
      wrap.classList.toggle('armed',Math.abs(dx)>el.offsetWidth*.3);
    };
    const end=()=>{
      if(!drag){pid=null;return}
      const w=el.offsetWidth, go=Math.abs(dx)>w*.3;
      el.style.transition='transform .18s ease';
      if(go){el.style.transform=`translateX(${dx>0?w:-w}px)`;setTimeout(()=>dx>0?remove(id):toggle(id),170)}
      else{el.style.transform='';wrap.classList.remove('to-del','to-ok','armed')}
      drag=false;pid=null;
    };
    el.onpointerup=end; el.onpointercancel=end;
    el.onclick=()=>{if(!moved)toggle(id);moved=false};
  });
}

/* Bilder aus dem privaten Daten-Repo (z. B. ausgewertete Einkaufszettel) – nur mit Schlüssel abrufbar */
const imgCache={};
async function repoImage(path){
  if(imgCache[path]) return imgCache[path];
  try{const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`,{headers:{...hdr(),Accept:'application/vnd.github.raw'}});
    if(!r.ok) return null; return imgCache[path]=URL.createObjectURL(await r.blob())}catch{return null}
}
async function deleteRepoFile(path){
  try{const u=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;const r=await fetch(u+'?t='+Date.now(),{headers:hdr()});if(!r.ok)return;
    const {sha}=await r.json();await fetch(u,{method:'DELETE',headers:hdr(),body:JSON.stringify({message:'Zettel-Foto gelöscht ('+(cfg.name||'?')+')',sha})})}catch{}
}

function deleteShop(id){
  const n=data.katalog.filter(p=>p.geschaeft===id).length, open=shopItems(id).length;
  const msg=`Geschäft „${shopName(id)}“ löschen?`+(open?`\n${open} Einträge auf der Liste werden entfernt.`:'')+(n?`\n${n} Produkte verlieren ihre Zuordnung (die App fragt dann beim nächsten Mal nach dem Geschäft).`:'');
  if(!confirm(msg)) return;
  change('Geschäft gelöscht: '+shopName(id),d=>{
    const ids=new Set(d.katalog.filter(p=>p.geschaeft===id).map(p=>p.id));
    d.liste=d.liste.filter(l=>!ids.has(l.id));
    for(const p of d.katalog) if(p.geschaeft===id) p.geschaeft='';
    d.geschaefte=d.geschaefte.filter(g=>g.id!==id);
    if(d.reihenfolge) delete d.reihenfolge[id];
  });
}

/* Inhalt einer Einkaufsliste (Tabs E/B und aufgeklappte Karten unter „Andere“) */
function shopBody(sh){
  const f=freq();
  const own=data.katalog.filter(p=>p.geschaeft===sh||p.auchBei===sh);
  const score=p=>(f[p.id]||0)*10+(p.favorit?5:0);
  const cand=own;
  let html=`<div class="seg"><button id="pSearch" class="${panel==='search'?'on':''}">🔍 Suchen/Neu</button><button id="pTop" class="${panel==='top'?'on':''}">⭐ Top-Hits</button><button id="pZettel" class="zbtn" title="Handgeschriebenen Einkaufszettel fotografieren">📷 Zettel</button></div>
    <input type="file" id="zIn" accept="image/*" capture="environment" hidden>`;
  if(panel==='search'){
    html+=`<div class="add"><input id="q" placeholder="Artikel suchen oder neu…" autocomplete="off" value="${esc(query)}"><button class="scanb" id="bScan" title="Barcode scannen">${BC_ICON}</button></div>`;
    if(query){
      const q=query.toLowerCase();
      const hits=cand.filter(p=>label(p).toLowerCase().includes(q)||p.kategorie.toLowerCase().includes(q)).sort((a,b)=>score(b)-score(a)).slice(0,12);
      html+=hits.map(prow).join('')+`<button class="btn sec" data-new="1" style="margin:4px 0 8px">＋ „${esc(query)}“ als neuen Artikel anlegen</button>`;
    }
  }else if(panel==='top'){
    const top=[...own].sort((a,b)=>score(b)-score(a)||a.name.localeCompare(b.name,'de'));
    html+=`<div class="toplist"><div class="tophead"><span>${esc(shopName(sh))} – nach Häufigkeit</span><button id="pClose">✕ Schließen</button></div>
      ${top.map(p=>prow(p).replace(/(<div class="prow[^>]*>)/,`$1<span class="hits">${f[p.id]||''}</span>`)).join('')||'<div class="empty">Noch keine Produkte für dieses Geschäft.</div>'}
      ${top.length>6?'<button class="btn sec" id="pClose2" style="margin:4px 0 0">Liste schließen</button>':''}</div>`;
  }
  const items=shopItems(sh);
  if(!items.length) html+=`<div class="empty">Nichts auf der Liste 🎉</div>`;
  const open=items.filter(l=>!l.erledigt).sort((a,b)=>rankOf(data,sh,prod(a.id))-rankOf(data,sh,prod(b.id)));
  const inCart=items.filter(l=>l.erledigt).sort((a,b)=>(a.um||0)-(b.um||0));
  for(const l of open) html+=listRow(l);
  if(inCart.length){html+=`<h2>Im Wagen</h2>`;inCart.forEach(l=>html+=listRow(l))}
  if(inCart.length&&open.length) html+=`<button class="btn" id="fin">Nur Abgehakte abschließen (${inCart.length})</button>`;
  if(items.length) html+=`<button class="btn" id="allDone">✓ Alles eingekauft – Liste leeren</button>`;
  return html;
}

let catQ='', catShop='';

/* ---------- Produkt per Foto: Foto (verkleinert) landet im Daten-Repo unter fotos/; eine geplante Aufgabe
   erkennt das Produkt einmal täglich abends, legt es im Katalog an und löscht das Foto ---------- */
const fotoApi=(p,dir='fotos')=>`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${dir}${p?'/'+p:''}`;
async function shrink(file,max=1600){
  const img=await createImageBitmap(file,{imageOrientation:'from-image'}).catch(()=>null);
  if(!img) return new Uint8Array(await file.arrayBuffer());
  const k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
  c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
  return new Uint8Array(await blob.arrayBuffer());
}
async function uploadPhoto(file,dir='fotos',tag=''){
  const bytes=await shrink(file,dir==='zettel'?2400:1600); let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
  const who=(cfg.name||'x').normalize('NFD').replace(/[^A-Za-z0-9]/g,'').slice(0,12)||'x';
  const name=new Date().toISOString().replace(/[-:]/g,'').replace('T','_').slice(0,15)+'_'+who+(tag?'_'+tag:'')+'_'+Math.random().toString(36).slice(2,6)+'.jpg';
  const r=await fetch(fotoApi(name,dir),{method:'PUT',headers:hdr(),body:JSON.stringify({message:(dir==='zettel'?'Einkaufszettel':'Produktfoto')+' ('+(cfg.name||'?')+')',content:btoa(bin)})});
  if(!r.ok) throw new Error('Foto-Upload fehlgeschlagen ('+r.status+')');
}
async function showPending(){

  try{const r=await fetch(fotoApi()+'?t='+Date.now(),{headers:hdr()});const n=r.ok?(await r.json()).filter(x=>/\.jpe?g$/i.test(x.name)).length:0;

/* Einladungen liegen nur auf dem Gerät des Administrators (mit Schlüssel), bis die Person sich angemeldet hat */
/* Einladungen (mit Schlüssel) liegen verschlüsselt in den gemeinsamen Daten – nur mit dem Administrator-Schlüssel lesbar,
   damit sie auf allen Geräten des Administrators sichtbar sind, aber nicht für die übrigen Nutzer */
const INV_KEY='einkauf.einladungen';
let showInv=null, addingMember=false, migrating=false;
const b64u=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const unb64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function adminKey(){const raw=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('einkauf-einladung|'+cfg.token));return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt'])}
async function encTok(t){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await adminKey(),new TextEncoder().encode(t));return{iv:b64u(iv),ct:b64u(ct)}}
async function decTok(x){try{return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(x.iv)},await adminKey(),unb64(x.ct)))}catch{return null}}
const inviteLink=(n,t)=>APP_URL+'#invite='+btoa(unescape(encodeURIComponent(JSON.stringify({n,o:cfg.owner,r:cfg.repo,p:cfg.path,t}))));
async function addInvite(n,t){
  const h=await tokHash(t), e=await encTok(t), id='i'+Date.now().toString(36);
  await change('Einladung angelegt: '+n,d=>{d.einladungen??=[];if(!d.einladungen.some(x=>x.h===h))d.einladungen.push({id,n,h,...e,am:today()})});
  return id;
}
async function renderFamily(){
  const box=$('#family'); if(!box) return;
  const g=data.geraete||{};
  /* ältere, nur auf diesem Gerät gespeicherte Einladungen einmalig übernehmen */
  const local=JSON.parse(localStorage.getItem(INV_KEY)||'[]');
  if(local.length&&!migrating){migrating=true;localStorage.removeItem(INV_KEY);for(const x of local){const h=await tokHash(x.t);if(!g[h]&&!(data.einladungen||[]).some(y=>y.h===h))await addInvite(x.n,x.t)}migrating=false;return renderFamily()}
  /* Einladungen bleiben verschlüsselt gespeichert; angemeldete Nutzer werden nur ausgeblendet.
     Nach „Gerät freigeben“ erscheint die Einladung wieder und kann erneut gezeigt werden. */
  const inv=await Promise.all((data.einladungen||[]).filter(x=>!g[x.h]).map(async x=>({...x,t:await decTok(x)})));
  const reg=Object.entries(g).sort((a,b)=>(a[1].rolle==='admin'?-1:1)-(b[1].rolle==='admin'?-1:1)||a[1].name.localeCompare(b[1].name,'de'));
  box.innerHTML=`<h3 style="margin-top:0">Nutzer</h3>
    ${reg.map(([h,x])=>`<div class="fam"><span>${esc(x.name)} <small class="hint">· ${x.rolle==='admin'?'Administrator · ':''}seit ${x.seit.split('-').reverse().join('.')}</small></span>${x.rolle!=='admin'?`<button data-free="${h}">Gerät freigeben</button>`:(h===myHash&&!addingMember?`<button id="invAdd">＋ Nutzer anlegen</button>`:'')}</div>`).join('')}
    ${inv.length?`<label class="hint" style="display:block;margin:12px 0 6px">Noch nicht angemeldet – Einladung per QR-Code oder Link</label>`:''}
    ${inv.map(x=>`<div class="fam"><span>${esc(x.n)}${x.t?'':' <small class="hint">· mit anderem Schlüssel angelegt</small>'}</span>${x.t?`<button data-qr="${x.id}">${showInv===x.id?'Ausblenden':'Einladung zeigen'}</button>`:''}<button data-rm="${x.id}" title="Einladung löschen">🗑</button></div>
      ${showInv===x.id&&x.t?`<div class="qrbox"><div class="qr" id="qrInv"></div>
        <input id="invLink" readonly value="${esc(inviteLink(x.n,x.t))}" style="width:100%;font-size:12px;padding:8px;border:1px solid var(--line);border-radius:8px">
        <div class="row" style="width:100%"><button class="btn sec" id="invCopy" style="margin:0;padding:10px">Link kopieren</button><button class="btn sec" id="invShare" style="margin:0;padding:10px">↗︎ Teilen</button></div>
        <small class="hint">QR-Code bzw. Link enthält den Schlüssel von ${esc(x.n)} – nur an diese Person schicken. Er funktioniert nur auf einem Gerät.</small></div>`:''}`).join('')}
    ${addingMember?`<div class="fam" style="display:block">
        <label class="hint">Name des neuen Nutzers</label>
        <input id="invName" name="family-member-name" autocomplete="off" data-lpignore="true" data-1p-ignore placeholder="z. B. Johannes" style="width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;margin:2px 0 8px">
        <label class="hint">Schlüssel dieser Person</label>
        <input id="invTok" name="family-member-key" type="text" autocomplete="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore placeholder="github_pat_…" autocapitalize="off" style="width:100%;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:8px;margin:2px 0 8px;-webkit-text-security:disc">
        <div class="row"><button class="btn sec" id="invX" style="margin:0;padding:10px">Abbrechen</button><button class="btn" id="invGo" style="margin:0;padding:10px">Anlegen</button></div></div>`
      :''}`;
  box.querySelectorAll('[data-free]').forEach(b=>b.onclick=()=>{
    const h=b.dataset.free, n=g[h]?.name;
    if(!confirm(`Gerät von ${n} freigeben?\nDer Schlüssel kann danach auf einem neuen Gerät angemeldet werden.`))return;
    showInv=(data.einladungen||[]).find(x=>x.h===h)?.id||null;  /* Einladung gleich wieder anzeigen */
    change('Gerät freigegeben: '+n,d=>{if(d.geraete)delete d.geraete[h]});
  });
  box.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>{const k=b.dataset.qr;showInv=showInv===k?null:k;renderFamily()});
  box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const k=b.dataset.rm,x=inv.find(y=>y.id===k);if(!confirm(`Einladung für ${x?.n} löschen?`))return;showInv=null;change('Einladung gelöscht: '+x?.n,d=>{d.einladungen=(d.einladungen||[]).filter(y=>y.id!==k)})});
  const cur=inv.find(x=>x.id===showInv&&x.t);
  if(cur){
    const link=inviteLink(cur.n,cur.t); qrInto('#qrInv',link);
    $('#invCopy').onclick=async()=>{try{await navigator.clipboard.writeText(link);setStatus('Link kopiert')}catch{$('#invLink').select();setStatus('Link markiert – bitte kopieren')}};
    $('#invShare').onclick=async()=>{try{if(navigator.share)await navigator.share({title:'Einkaufsliste – Einladung für '+cur.n,url:link});else{await navigator.clipboard.writeText(link);setStatus('Link kopiert')}}catch{}};
  }
  $('#invAdd')&&($('#invAdd').onclick=async()=>{addingMember=true;await renderFamily();$('#invName').value='';$('#invTok').value='';setTimeout(()=>{$('#invName').value='';$('#invTok').value='';$('#invName').focus()},150)});
  $('#invX')&&($('#invX').onclick=()=>{addingMember=false;renderFamily()});
  $('#invGo')&&($('#invGo').onclick=async()=>{
    const n=$('#invName').value.trim(), t=clean($('#invTok').value);
    if(!n||!t){setStatus('⚠︎ Bitte Name und Schlüssel eintragen');return}
    const h=await tokHash(t);
    if(g[h]){setStatus('⚠︎ Dieser Schlüssel ist schon angemeldet');return}
    if(h===myHash){setStatus('⚠︎ Das ist Ihr eigener Schlüssel – bitte für die Person einen eigenen anlegen');return}
    addingMember=false; showInv=await addInvite(n,t); renderFamily();
  });
}
const APP_URL=location.protocol==='https:'?location.origin+location.pathname.replace(/index\.html$/,''):'https://ntsv2014.github.io/einkaufsliste/';
async function qrInto(sel,text){
  try{
    await new Promise((ok,no)=>{if(window.qrcode)return ok();const sc=document.createElement('script');sc.src='qrcode.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
    const q=qrcode(0,'M'); q.addData(text); q.make();
    const el=$(sel); if(el) el.innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true});
  }catch{const el=$(sel);if(el)el.textContent='QR-Code nicht verfügbar'}
}

/* iPhone/iPad: Safari und die App auf dem Home-Bildschirm haben getrennte Speicher. Deshalb wird eine Einladung
   in Safari nicht angemeldet, sondern es gibt eine Anleitung; der Link wird danach in der App eingefügt. */
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const STANDALONE=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
function parseInvite(str){
  const m=String(str||'').match(/invite=([A-Za-z0-9+/=_-]+)/); if(!m) return null;
  try{const v=JSON.parse(decodeURIComponent(escape(atob(m[1]))));return v.t?{name:v.n,owner:v.o,repo:v.r,path:v.p||'liste.json',token:v.t}:null}catch{return null}
}
function useInvite(c){cfg=c;localStorage.setItem(LS,JSON.stringify(cfg));setTimeout(()=>setStatus('Willkommen, '+c.name+'!'),800)}

    <button class="btn" id="iosCopy">Einladungslink kopieren</button>
    <p class="hint">Der Link enthält deinen persönlichen Schlüssel – bitte nicht weitergeben. Er funktioniert nur auf einem Gerät.</p></div>`;
  $('#iosCopy').onclick=async()=>{try{await navigator.clipboard.writeText(link);setStatus('Link kopiert – jetzt „Zum Home-Bildschirm“')}catch{prompt('Bitte kopieren:',link)}};
}
let iosInvite=null;
(()=>{
  const m=location.hash.match(/invite=([^&]+)/); if(!m) return;
  const link=location.href;
  history.replaceState(null,'',location.pathname+location.search);
  const c=parseInvite(link);
  if(!c){setTimeout(()=>setStatus('⚠︎ Einladungs-Code ungültig'),500);return}
  if(IOS&&!STANDALONE&&!cfg){iosInvite={link,name:c.name};return}
  useInvite(c);
})();
iosInvite?renderIosInstall(iosInvite.link,iosInvite.name):cfg?refresh():renderSetup();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
