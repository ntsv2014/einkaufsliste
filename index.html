<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f2937" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#05070a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Einkaufsliste</title>
<style>
:root{color-scheme:light dark;--bg:#f4f4f2;--card:#fff;--fg:#1f2937;--hdr:#1f2937;--mute:#6b7280;--line:#e5e7eb;--acc:#f5c400;--ok:#16a34a;--btn2:#e5e7eb;--stepbg:#f3f4f6;--panel:#e9ecf1;--ts:80%;--tl:89%;--onbg:#d1fae5;--onfg:#065f46;--tab:#374151;--tabfg:#d1d5db}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1115;--card:#1b1f27;--fg:#e5e7eb;--hdr:#05070a;--mute:#9ca3af;--line:#2d333d;--btn2:#2d333d;--stepbg:#262b34;--panel:#151920;--ts:38%;--tl:24%;--onbg:#064e3b;--onfg:#a7f3d0;--tab:#1b1f27;--tabfg:#9ca3af}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0f1115;--card:#1b1f27;--fg:#e5e7eb;--hdr:#05070a;--mute:#9ca3af;--line:#2d333d;--btn2:#2d333d;--stepbg:#262b34;--panel:#151920;--ts:38%;--tl:24%;--onbg:#064e3b;--onfg:#a7f3d0;--tab:#1b1f27;--tabfg:#9ca3af}
:root[data-theme=light]{color-scheme:light}
button,input,select{color:var(--fg);font-family:inherit}
input,select{background:var(--card)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--hdr);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 8px 0}
.top{display:flex;align-items:flex-end;gap:4px}
.cart{flex:none;border:0;background:none;font-size:24px;padding:0 2px 8px;line-height:1}
.cart.on{filter:drop-shadow(0 0 6px #f7c600)}
nav{display:flex;gap:3px;overflow-x:auto;flex:1;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;border:0;border-radius:9px 9px 0 0;padding:10px 5px;font-size:13px;font-weight:600;background:var(--tab);color:var(--tabfg);white-space:nowrap}
nav button.info{flex:0 0 auto;font-size:15px;padding:9px 7px}
nav .n{margin-left:3px;padding:0 5px;min-width:16px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--hdr);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw;box-shadow:0 4px 18px rgba(0,0,0,.3);transition:opacity .3s}

nav button.on{background:var(--bg);color:var(--fg)}
nav .n{display:inline-block;min-width:20px;margin-left:4px;padding:0 6px;border-radius:10px;background:var(--acc);color:#111;font-size:12px}
main{padding:12px;max-width:640px;margin:0 auto}
.add{display:flex;gap:6px;position:sticky;top:0}
.add input{flex:1;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.sugg{background:var(--card);border-radius:10px;margin-top:6px;box-shadow:0 4px 14px rgba(0,0,0,.08);overflow:hidden}
.sugg div{padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.sugg div:last-child{border:0}
.sugg small,.item small{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:6px 10px;font-size:14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:18px 4px 6px}
.item{display:flex;align-items:center;gap:9px;background:var(--card);padding:6px 6px 6px 10px;border-radius:8px;margin-bottom:3px;cursor:pointer;user-select:none;font-size:15px;min-height:40px}
.item .box{width:21px;height:21px;border:2px solid #9ca3af;border-radius:5px;flex:none;display:grid;place-items:center;color:#fff;font-size:13px}
.item.done{opacity:.55}
.item.done .box{background:var(--ok);border-color:var(--ok)}
.item.done .t{text-decoration:line-through}
.item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--mute);font-size:13px}
.item .x{border:0;background:none;color:var(--mute);font-size:18px;padding:0 6px}
.qty{font-weight:700;margin-right:2px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:600;background:var(--ok);color:#fff;margin-top:14px}
.btn.sec{background:var(--btn2);color:var(--fg)}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.setup{background:var(--card);border-radius:12px;padding:16px}
.setup label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.setup input{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px}
.err{color:#b91c1c;margin-top:10px;white-space:pre-wrap;font-size:13px}
dialog{border:0;border-radius:14px;padding:16px;width:min(92vw,420px);background:var(--card);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog input,dialog select{width:100%;font-size:16px;padding:10px;margin:4px 0 10px;border:1px solid var(--line);border-radius:8px}
dialog label{font-size:13px;color:var(--mute)}
.row{display:flex;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:12px}
.tile{position:relative;background:var(--card);border:0;border-radius:14px;padding:14px 6px 10px;text-align:center;font-size:13px;font-weight:600;color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.06);min-height:96px}
.tile .e{display:block;font-size:34px;line-height:1.2;margin-bottom:4px}
.tile .n{position:absolute;top:6px;right:6px;min-width:20px;padding:0 6px;border-radius:10px;background:var(--acc);font-size:12px}
.ghead{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.ghead button{border:0;background:var(--card);color:var(--fg);border-radius:10px;padding:8px 12px;font-size:16px}
.ghead h3{margin:0;font-size:19px;flex:1}
.prow{display:flex;align-items:center;gap:8px;background:var(--card);padding:8px 8px 8px 10px;border-radius:10px;margin-bottom:5px}
.prow .t{flex:1;min-width:0}
.prow small{color:var(--mute)}
.prow .on{display:inline-block;margin-top:2px;font-size:12px;color:var(--onfg);background:var(--onbg);border-radius:8px;padding:0 6px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none;background:var(--card)}
.step button{border:0;background:var(--stepbg);width:38px;height:38px;font-size:20px;font-weight:700}
.step span{min-width:44px;text-align:center;font-weight:700;line-height:1.1;padding:0 2px}.step span small{display:block;font-size:10px;font-weight:600;color:var(--mute)}
.prow .t[data-edit]{cursor:pointer}
.send{border:0;border-radius:10px;height:40px;padding:0 10px;font-size:14px;font-weight:700;color:#fff;flex:none;min-width:74px}
.send.edeka{background:#d4a800;color:#111}.send.budni{background:#1b3f8b}.send.tibarg{background:#0e7490}.send.baumarkt{background:#c2410c}.send.sonstiges{background:#6b7280}.send.none{background:#9ca3af;color:#111}
.send.upd{outline:3px solid #16a34a55}
.add .scanb{flex:none;border:0;border-radius:10px;background:var(--hdr);color:#fff;width:52px;display:grid;place-items:center}
#fScan svg{vertical-align:-4px;margin-right:4px}
dialog.scan{padding:0;width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0;background:#000;color:#fff}
dialog.scan video{width:100%;height:100%;object-fit:cover}
.scanFrame{position:fixed;left:8%;right:8%;top:35%;height:22%;border:3px solid #f7c600;border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);pointer-events:none}
.scanBar{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.scanBar button{margin-top:10px;border:0;border-radius:10px;padding:12px 28px;font-size:16px;font-weight:600}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:#fde68a}}
#fAssBox{background:var(--stepbg);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 6px;font-size:15px;font-weight:600}
.seg button.on{background:var(--hdr);color:#fff;border-color:var(--hdr)}
.toplist{background:var(--panel);border-radius:12px;padding:8px;margin-bottom:8px}
.tophead{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px;font-size:13px;font-weight:600;color:var(--mute)}
.tophead button{border:0;background:var(--hdr);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
.prow .hits{flex:none;min-width:18px;font-size:12px;font-weight:700;color:var(--mute);text-align:center}
.stats div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.item.tint,.prow.tint{background:hsl(var(--h) var(--ts) var(--tl))}
.scard{background:var(--panel);border-radius:12px;padding:8px;margin-bottom:10px}
.shead{display:flex;align-items:center;gap:8px;padding:2px 4px 8px;font-size:16px}
.shead .cnt{min-width:20px;padding:0 6px;border-radius:10px;background:var(--acc);color:#111;font-size:12px;text-align:center}
.shead .del{border:0;background:none;font-size:18px;padding:2px 6px;opacity:.75}
.send{background:#7c3aed}
nav button{position:relative}
nav .tl{display:inline-grid;place-items:center;width:28px;height:24px;border-radius:6px;font-weight:900;font-size:19px;line-height:1;font-family:Arial Black,Arial,sans-serif}
nav .tl-e{background:#f7c600;color:#1f2937;font-size:15px}
nav .tl-b{font-size:15px}
nav .tl-b{background:#1d4fa8;color:#fff}
nav button:has(.tl){padding:7px 8px}
nav .dot{position:absolute;top:5px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 1.5px var(--hdr)}
nav button.on .dot{box-shadow:0 0 0 1.5px var(--bg)}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0 4px}
.qrbox .qr{background:#fff;padding:8px;border-radius:12px;line-height:0}
.qrbox .qr svg{width:190px;height:190px}
.qrbox a{color:var(--fg);font-size:14px;word-break:break-all}
.hint{color:var(--mute);font-size:13px}
.fam{display:flex;align-items:center;gap:8px;background:var(--stepbg);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.fam span{flex:1;min-width:0}
.fam button{border:0;border-radius:8px;background:var(--btn2);padding:8px 10px;font-size:13px;font-weight:600}
.fam .btn{background:var(--ok);color:#fff;font-size:15px}
.fam .btn.sec{background:var(--btn2);color:var(--fg)}
.fam button#invAdd{white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="top"><button id="bHome" class="cart" title="Produktgruppen">🛒</button><nav id="tabs"></nav></div>
</header>
<main id="main"></main>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3 style="margin-top:0" id="dlgT">Neuer Artikel</h3>
    <div id="fAssBox" hidden>
      <small id="fEanTxt"></small>
      <label>… oder einem vorhandenen Produkt zuordnen</label>
      <div class="row"><select id="fAss" style="flex:1;margin:0"></select><button type="button" class="btn" id="fAssBtn" style="width:auto;margin:0;padding:8px 14px">Zuordnen</button></div>
    </div>
    <label>Name</label><input id="fName" required>
    <label>Marke (optional)</label><input id="fMarke">
    <div class="row">
      <div style="flex:1"><label>Geschäft</label><select id="fShop"></select></div>
      <div style="flex:1"><label>Kategorie</label><input id="fKat" list="kats"></div>
    </div>
    <div class="row">
      <div style="flex:1"><label>Maßeinheit</label><select id="fEinh"></select></div>
      <div style="flex:1"><label>Packungsgröße (optional)</label><input id="fMenge" placeholder="z. B. 500 g"></div>
    </div>
    <datalist id="kats"></datalist>
    <button type="button" class="btn sec" id="fScan" hidden>Barcode diesem Produkt zuordnen</button>
    <div class="row"><button class="btn sec" value="cancel" type="button" id="fCancel">Abbrechen</button><button class="btn" value="ok" id="fOk">Hinzufügen</button></div>
  </form>
</dialog>

<dialog id="dScan" class="scan">
  <video id="scanV" playsinline muted></video>
  <div class="scanFrame"></div>
  <div class="scanBar"><div id="scanTxt">Barcode in den Rahmen halten</div><button id="scanX">Abbrechen</button></div>
</dialog>
<dialog id="dShop">
  <h3 style="margin-top:0">Wo gibt es das?</h3>
  <p id="dShopTxt" style="color:var(--mute);margin-top:0"></p>
  <div id="dShopBtns" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
  <button class="btn sec" id="dShopX">Abbrechen</button>
</dialog>

<script>
"use strict";
/* App-Design: auto (wie Handy) / hell / dunkel – pro Gerät gespeichert */
const THEME_KEY='einkauf.theme';
function applyTheme(t){
  if(t==='light'||t==='dark') document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme;
  const dark=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelectorAll('meta[name=theme-color]').forEach(m=>{m.content=dark?'#05070a':'#1f2937';m.removeAttribute('media')});
}
applyTheme(localStorage.getItem(THEME_KEY)||'auto');
const LS='einkauf.cfg';
let cfg=JSON.parse(localStorage.getItem(LS)||'null');
let data=null, sha=null, shop=null, query='', busy=false, view='home', group=null, panel=null, xq=null, addingShop=false, newShopDefault=''; const cnt={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
let toastT=null;
function setStatus(t){
  let el=$('#toast'); if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el)}
  el.textContent=t; el.style.opacity=1; clearTimeout(toastT); toastT=setTimeout(()=>el.style.opacity=0,t.startsWith('⚠')?6000:2500);
}

/* ---------- GitHub ---------- */
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const b64enc=s=>{const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode(...b.subarray(i,i+0x8000));return btoa(r)};
const api=()=>`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path||'liste.json'}`;
const hdr=()=>({Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'});
/* Eingaben bereinigen: Leerzeichen, Zeilenumbrüche, unsichtbare Zeichen, kopierte URLs */
const clean=v=>String(v||'').replace(/[^\x21-\x7e]/g,'');
const cleanName=v=>clean(v).replace(/^https?:\/\/(www\.)?github\.com\//i,'').replace(/\.github\.io.*$/i,'').replace(/^\/+|\/+$/g,'');
/* Schrittweise Fehlersuche, falls die Verbindung scheitert */
async function diagnose(){
  const out=[];
  const t=async(label,url,auth)=>{
    try{const r=await fetch(url,auth?{headers:hdr()}:{});out.push(`${label}: ${r.status}${r.ok?' ✓':''}`);return r}
    catch(e){out.push(`${label}: ${e.name} – ${e.message}`);return null}
  };
  out.push(`Benutzer „${cfg.owner}“, Repo „${cfg.repo}“, Datei „${cfg.path}“`);
  out.push(`Schlüssel: ${cfg.token.length} Zeichen, beginnt mit „${cfg.token.slice(0,11)}“`);
  await t('1 GitHub erreichbar','https://api.github.com/rate_limit',false);
  const u=await t('2 Schlüssel gültig','https://api.github.com/user',true);
  if(u&&u.ok){try{out.push('   angemeldet als '+(await u.json()).login)}catch{}}
  await t('3 Repo sichtbar',`https://api.github.com/repos/${cfg.owner}/${cfg.repo}`,true);
  await t('4 Datei lesbar',api(),true);
  return out.join('\n');
}

async function load(){
  const r=await fetch(api()+'?t='+Date.now(),{headers:hdr()});
  if(!r.ok) throw new Error(r.status===401?'Token ungültig':r.status===404?'Repo oder Datei nicht gefunden':'Fehler '+r.status);
  const j=await r.json(); sha=j.sha; data=JSON.parse(b64dec(j.content));
  data.liste??=[]; data.historie??=[];
  /* fehlende Geschäfte ergänzen, feste Reihenfolge */
  for(const [id,name] of [['edeka','Edeka'],['budni','Budni'],['tibarg','Tibarg']]) if(!data.geschaefte.some(g=>g.id===id)) data.geschaefte.push({id,name});
  /* weitere Geschäfte nur einmal anlegen – danach entscheidet die Familie über + und Papierkorb */
  if(!data.weitereAngelegt){
    for(const [id,name] of [['baumarkt','Baumarkt'],['sonstiges','Sonstiges']]) if(!data.geschaefte.some(g=>g.id===id)) data.geschaefte.push({id,name});
    data.weitereAngelegt=true;
  }
  data.geschaefte.sort((a,b)=>{const i=x=>{const k=CORE.indexOf(x.id);return k<0?99:k};return i(a)-i(b)});
}
async function save(msg){
  const r=await fetch(api(),{method:'PUT',headers:hdr(),body:JSON.stringify({message:msg+' ('+(cfg.name||'?')+')',content:b64enc(JSON.stringify(data,null,1)),sha})});
  if(r.status===409||r.status===422) return false;
  if(!r.ok) throw new Error('Speichern fehlgeschlagen: '+r.status);
  sha=(await r.json()).content.sha; return true;
}
/* Änderung anwenden; bei Konflikt neu laden und erneut anwenden */
/* Jede Aktion: sofort anzeigen, dann frischen Stand holen, Änderung darauf anwenden und speichern */
async function change(msg,fn){
  if(busy) return; busy=true;
  try{
    fn(data); render();
    for(let i=0;i<4;i++){
      await load(); fn(data); render();
      if(await save(msg)) return;
    }
    throw new Error('Konflikt – bitte neu laden');
  }catch(e){setStatus('⚠︎ '+e.message)}finally{busy=false}
}
/* Aktualisieren beim Öffnen/Zurückkehren und beim Wechseln der Ansicht */
async function refresh(){
  if(busy||!cfg) return;
  try{await load();await checkDevice();if(!document.querySelector('dialog[open]'))render();await autoFinish()}
  catch(e){if(e.message==='BLOCKED')return renderBlocked();setStatus('⚠︎ '+e.message)}
}
/* ---------- Geräte: Schlüssel eines Familienmitglieds gilt nur auf einem Gerät, Administrator frei ---------- */
const DEV_KEY='einkauf.device';
const deviceId=localStorage.getItem(DEV_KEY)||(()=>{const id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));localStorage.setItem(DEV_KEY,id);return id})();
let myHash=null, myRole=null;
async function tokHash(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].slice(0,12).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function checkDevice(){
  myHash=await tokHash(cfg.token);
  const g=data.geraete||{}, e=g[myHash];
  if(e){
    myRole=e.rolle;
    if(e.rolle!=='admin'&&e.geraet!==deviceId) throw new Error('BLOCKED');
    return;
  }
  /* erster Start mit diesem Schlüssel: der allererste wird Administrator, alle weiteren Familienmitglieder */
  myRole=Object.values(g).some(x=>x.rolle==='admin')?'mitglied':'admin';
  const h=myHash, role=myRole, name=cfg.name||'?';
  busy=false;
  await change('Gerät angemeldet: '+name,d=>{d.geraete??={};if(!d.geraete[h])d.geraete[h]={name,rolle:role,geraet:deviceId,seit:today()}});
}
function renderBlocked(){
  data=null; localStorage.removeItem(LS);
  $('#tabs').innerHTML='';
  $('#main').innerHTML=`<div class="setup"><h3 style="margin-top:0">🔒 Schlüssel bereits vergeben</h3>
    <p>Dieser Schlüssel ist schon auf einem anderen Gerät angemeldet und kann hier nicht verwendet werden.</p>
    <p class="hint">Bei einem neuen Handy kann der Administrator das alte Gerät unter ⓘ → Familie freigeben.</p>
    <button class="btn" id="bAgain">Anderen Schlüssel eingeben</button></div>`;
  cfg=null; $('#bAgain').onclick=renderSetup;
}

/* ---------- Logik ---------- */
const prod=id=>data.katalog.find(p=>p.id===id);
const label=p=>p.marke?`${p.marke} ${p.name}`:p.name;
function freq(){const f={};for(const h of data.historie)f[h.id]=(f[h.id]||0)+1;return f}
function lastBought(id){let d='';for(const h of data.historie)if(h.id===id&&h.datum>d)d=h.datum;return d}
function shopItems(s){return data.liste.filter(l=>{const p=prod(l.id);return p&&p.geschaeft===s})}

  });
  query='';
}
/* Laufweg: Startreihenfolge aus den Gängen des Geschäfts, danach gelernt aus der Abhak-Reihenfolge */
function defRank(d,s,p){
  const g=d.geschaefte.find(x=>x.id===s)?.gaenge||[];
  let i=g.indexOf(p.kategorie);
  if(i<0) i=g.length+[...new Set(d.katalog.map(x=>x.kategorie))].sort((a,b)=>a.localeCompare(b,'de')).indexOf(p.kategorie);
  return i*10000+d.katalog.findIndex(x=>x.id===p.id);
}
const rankOf=(d,s,p)=>d.reihenfolge?.[s]?.[p.id]??defRank(d,s,p);
function toggle(id){
  const t=Date.now();
  change('✓ '+label(prod(id)),d=>{const e=d.liste.find(l=>l.id===id);if(e){e.erledigt=!e.erledigt;if(e.erledigt)e.um=t;else delete e.um}});
}
function remove(id){change('− '+label(prod(id)),d=>{d.liste=d.liste.filter(l=>l.id!==id)})}
function finish(s=shop,auto=false){
  const n=shopItems(s).filter(l=>l.erledigt).length; if(!n) return;
  return change(`${auto?'Automatisch abgeschlossen':'Einkauf'} ${shopName(s)}: ${n} Artikel`,d=>{
    const done=d.liste.filter(l=>l.erledigt&&prod(l.id)?.geschaeft===s);
    /* Die abgehakten Artikel tauschen ihre Plätze im Laufweg so, dass sie der tatsächlichen Abhak-Reihenfolge entsprechen */
    const seq=[...done].sort((a,b)=>(a.um||0)-(b.um||0)).map(l=>d.katalog.find(x=>x.id===l.id)).filter(Boolean);
    if(seq.length>1){
      const slots=seq.map(p=>rankOf(d,s,p)).sort((a,b)=>a-b);
      d.reihenfolge??={}; d.reihenfolge[s]??={};
      seq.forEach((p,i)=>d.reihenfolge[s][p.id]=slots[i]);
    }
    for(const l of done) d.historie.push({id:l.id,datum:l.um?new Date(l.um).toISOString().slice(0,10):today(),anzahl:l.anzahl||1,wer:cfg.name||''});
    d.liste=d.liste.filter(l=>!done.includes(l));
  });
}
const AUTO_MS=60*60*1000;
async function autoFinish(){
  if(!data) return;
  for(const s of SHOPS()){
    const done=shopItems(s).filter(l=>l.erledigt); if(!done.length) continue;
    const last=Math.max(...done.map(l=>l.um||0));
    if(Date.now()-last>AUTO_MS){await finish(s,true);setStatus(`Einkauf ${shopName(s)} automatisch abgeschlossen`)}
  }
}

/* Maßeinheiten: Plural, Schrittweite */
const EINH={'Stück':['Stück',1],'Packung':['Packungen',1],'Flasche':['Flaschen',1],'Glas':['Gläser',1],'Dose':['Dosen',1],'Becher':['Becher',1],'Tube':['Tuben',1],'Beutel':['Beutel',1],'Netz':['Netze',1],'Bund':['Bund',1],'Sixpack':['Sixpacks',1],'Kiste':['Kisten',1],'kg':['kg',0.5],'g':['g',100],'l':['l',0.5],'ml':['ml',100]};
/* Für Katalogartikel ohne gespeicherte Einheit eine sinnvolle Vorgabe ableiten */
function guessUnit(p){
  const t=(p.name+' '+(p.marke||'')+' '+(p.menge||'')).toLowerCase(), k=p.kategorie;
  const has=(...w)=>w.some(x=>t.includes(x));
  if(has('sixpack')) return 'Sixpack';
  if(k==='Getränke') return has('pils','radler')?'Flasche':'Packung';
  if(['Tiefkühl','Süßes & Snacks','Backen','Nudeln & Reis','Brot'].includes(k)) return 'Packung';
  if(has('glasreiniger')) return 'Flasche';
  if(has('riegel','rasierklingen')) return 'Packung';
  if(has('kiwi','maiskolben')) return 'Packung';
  if(has('tube','zahncreme','tomatenmark','mayonnaise','rasiercreme','handcreme','hand- & nagel','gelée','fluoridgel')) return 'Tube';
  if(has('dose','mandarin','pfirsich','goldmais','nivea creme')) return 'Dose';
  if(has('glas','gurken','pesto','basilico','passata','sauerkraut','apfelmus','konfitüre','honig','crunchy cream','pickles','bambus','knoblauch','tomaten fein')) return 'Glas';
  if(has('becher','crème fraîche','sanella','streichzarte','frischkäse','kräuter-frischkäse','miree')) return 'Becher';
  if(has('pils','radler','öl','saft','ketchup','sauce','aceto','balsamico','shampoo','spülung','dusch','lotion','mundspülung','reiniger','weichspüler','spüler','scheuermilch','parkettpflege','fleckentferner','perwoll','coral','sagrotan','intimate','nagellack','rohrfrei','backofen','schimmel','pflege-öl','reinigungsmilch')) return 'Flasche';
  if(has('äpfel','orangen','karotten')) return 'kg';
  if(has('paprika','gurke','butter 250','lippen','mascara','deo','rasierklingen')) return 'Stück';
  if(['Obst & Gemüse','Gesicht','Kosmetik','Herren'].includes(k)) return 'Stück';
  return 'Packung';
}
const unitOf=p=>p?(EINH[p.einheit]?p.einheit:guessUnit(p)):'Stück';
const stepOf=p=>EINH[unitOf(p)][1];
const fmtN=n=>String(Math.round(n*100)/100).replace('.',',');
const fmtQ=(p,n)=>{const u=unitOf(p);return fmtN(n)+' '+(n===1?u:EINH[u][0])};

/* ---------- Barcode ---------- */
let scanEan=null;
const BC_ICON='<svg viewBox="0 0 28 20" width="28" height="20" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="2" height="18"/><rect x="5" y="1" width="1" height="18"/><rect x="8" y="1" width="3" height="18"/><rect x="13" y="1" width="1" height="18"/><rect x="16" y="1" width="2" height="18"/><rect x="20" y="1" width="1" height="18"/><rect x="23" y="1" width="1.5" height="18"/><rect x="26" y="1" width="1" height="18"/></svg>';
const loadScript=src=>new Promise((ok,no)=>{if(window.ZXing)return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('Scanner konnte nicht geladen werden'));document.head.appendChild(s)});
function scanBarcode(){
  const dl=$('#dScan'), v=$('#scanV'), txt=$('#scanTxt');
  let stream=null, stop=false, zx=null, done=false;
  return new Promise(res=>{
    const finish=code=>{
      if(done) return; done=true; stop=true;
      try{zx&&zx.reset()}catch{}
      if(stream) stream.getTracks().forEach(t=>t.stop());
      if(v.srcObject) v.srcObject.getTracks?.().forEach(t=>t.stop());
      v.srcObject=null; if(dl.open) dl.close();
      if(code) navigator.vibrate?.(80);
      res(code);
    };
    $('#scanX').onclick=()=>finish(null);
    dl.oncancel=e=>{e.preventDefault();finish(null)};
    txt.textContent='Kamera wird gestartet…'; dl.showModal();
    (async()=>{
      try{
        const cam={video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}};
        let det=null;
        if('BarcodeDetector' in window){
          try{const fm=await BarcodeDetector.getSupportedFormats();const want=['ean_13','ean_8','upc_a','upc_e','code_128'].filter(f=>fm.includes(f));if(want.length)det=new BarcodeDetector({formats:want})}catch{}
        }
        if(det){
          stream=await navigator.mediaDevices.getUserMedia(cam); v.srcObject=stream; await v.play();
          txt.textContent='Barcode in den Rahmen halten';
          const loop=async()=>{if(stop)return;try{const r=await det.detect(v);if(r.length)return finish(r[0].rawValue)}catch{}setTimeout(loop,120)};
          loop();
        }else{
          await loadScript('zxing.min.js'); if(stop) return;
          const hints=new Map();
          hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128]);
          zx=new ZXing.BrowserMultiFormatReader(hints);
          txt.textContent='Barcode in den Rahmen halten';
          await zx.decodeFromConstraints(cam,v,r=>{if(r&&!stop)finish(r.getText())});
        }
      }catch(e){txt.textContent=(e.name==='NotAllowedError'?'Kamera-Zugriff wurde nicht erlaubt. Bitte in den Browser-Einstellungen für diese Seite erlauben.':'Kamera nicht verfügbar: '+e.message)}
    })();
  });
}
const byEan=code=>data.katalog.find(p=>(p.eans||[]).includes(code));
function addEan(id,code){
  return change('Barcode → '+label(prod(id)),d=>{
    for(const x of d.katalog) if(x.eans) x.eans=x.eans.filter(c=>c!==code||x.id===id);
    const x=d.katalog.find(x=>x.id===id); if(!x) return;
    x.eans=[...new Set([...(x.eans||[]),code])];
  });
}

  const p=prod(id); if(!p) return;
  group=p.kategorie; view='group'; query=''; render();
  const el=document.querySelector(`.prow [data-send="${id}"]`)?.closest('.prow');

/* Produktdaten zu unbekannten Barcodes bei Open Food/Beauty/Products Facts nachschlagen */
async function lookupEan(code){
  for(const host of ['world.openfoodfacts.org','world.openbeautyfacts.org','world.openproductsfacts.org']){
    try{
      const r=await fetch(`https://${host}/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_de,generic_name_de,brands,quantity`);
      if(!r.ok) continue; const j=await r.json();
      if(j.status===1&&j.product){const p=j.product;return{name:p.product_name_de||p.product_name||p.generic_name_de||'',marke:(p.brands||'').split(',')[0].trim(),menge:p.quantity||''}}
    }catch{}
  }
  return null;
}
function similar(info){
  const words=(info?(info.name+' '+info.marke):'').toLowerCase().split(/[^a-zäöüß0-9]+/).filter(w=>w.length>2);
  const sc=p=>{const t=label(p).toLowerCase();return words.reduce((a,w)=>a+(t.includes(w)?1:0),0)};
  return [...data.katalog].map(p=>({p,s:sc(p)})).sort((a,b)=>b.s-a.s||a.p.name.localeCompare(b.p.name,'de'));
}
async function onScan(){
  const code=await scanBarcode(); if(!code) return;
  const hit=byEan(code);
  if(hit){setStatus('Gefunden: '+label(hit));return showProduct(hit.id)}
  setStatus('Unbekannter Barcode – suche Produktdaten…');
  const info=await lookupEan(code);
  setStatus(info?'Produktdaten gefunden':'Keine Produktdaten gefunden');
  query=info?.name||''; newProduct(); query='';
  scanEan=code;
  if(info){$('#fMarke').value=info.marke;$('#fMenge').value=info.menge}
  $('#fEanTxt').textContent=`Barcode ${code}`+(info?' – Angaben aus der Open-Food-Facts-Datenbank, bitte prüfen.':' – nicht in der Datenbank, bitte Namen eintragen.');
  const list=similar(info);
  $('#fAss').innerHTML='<option value="">– Produkt wählen –</option>'+list.map(({p,s})=>`<option value="${p.id}">${s?'★ ':''}${esc(label(p))}</option>`).join('');
  $('#fAssBox').hidden=false;
}

/* ---------- Ansicht ---------- */
function renderTabs(){
  $('#bHome').classList.toggle('on',view==='home'||view==='group');
  /* Punkt am Tab: seit dem letzten Besuch dieses Tabs hat jemand anderes etwas auf die Liste gesetzt */
  const seen=JSON.parse(localStorage.getItem(SEEN_KEY)||'{}');
  const fresh=(ids,key)=>data.liste.some(l=>!l.erledigt&&(l.ts||0)>(seen[key]||0)&&l.von!==cfg.name&&ids.includes(prod(l.id)?.geschaeft));
  const dot=b=>b?'<span class="dot"></span>':'';
  $('#tabs').innerHTML=CORE.map(id=>`<button data-v="shop" data-s="${id}" class="${view==='shop'&&id===shop?'on':''}" title="${esc(shopName(id))}">${TABLABEL[id]||esc(shopName(id))}${dot(fresh([id],id))}</button>`).join('')
    +`<button data-v="extra" class="${view==='extra'?'on':''}">Andere${dot(fresh(EXTRAS().map(g=>g.id),'andere'))}</button>`
    +`<button data-v="info" class="info ${view==='info'||view==='stats'?'on':''}" title="Info">ⓘ</button>`;
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.v,b.dataset.s));
  const on=$('#tabs .on'); on&&on.scrollIntoView({inline:'nearest',block:'nearest'});
}
const SEEN_KEY='einkauf.seen';
const TABLABEL={edeka:'<span class="tl tl-e">E</span>',budni:'<span class="tl tl-b">B</span>'};
function markSeen(){
  const k=view==='shop'?shop:view==='extra'?'andere':null; if(!k) return;
  const seen=JSON.parse(localStorage.getItem(SEEN_KEY)||'{}'); seen[k]=Date.now(); localStorage.setItem(SEEN_KEY,JSON.stringify(seen));
}
function go(v,s){query='';panel=null;xq=null;addingShop=false;view=v;if(s)shop=s;render();scrollTo(0,0);refresh()}
$('#bHome').onclick=()=>go('home');
function listRow(l){const p=prod(l.id);return `<div class="item tint ${l.erledigt?'done':''}" style="--h:${hueOf(p.kategorie)}" data-t="${l.id}"><span class="box">${l.erledigt?'✓':''}</span>
        <span class="t"><span class="qty">${fmtQ(p,l.anzahl||1)}</span> ${esc(p.name)}${p.marke?` <small>${esc(p.marke)}</small>`:''}</span>
        <button class="x" data-x="${l.id}">✕</button></div>`}
function bindList(){
  const m=$('#main');
  m.querySelectorAll('[data-t]').forEach(e=>e.onclick=ev=>{if(!ev.target.closest('[data-x]'))toggle(e.dataset.t)});
  m.querySelectorAll('[data-x]').forEach(e=>e.onclick=()=>remove(e.dataset.x));
}
/* ---------- Tab „Sonstige“: weitere Geschäfte als Karten ---------- */
function renderExtras(){
  let html='';
  for(const g of EXTRAS()){
    const items=shopItems(g.id);
    const open=items.filter(l=>!l.erledigt).sort((a,b)=>rankOf(data,g.id,prod(a.id))-rankOf(data,g.id,prod(b.id)));
    const done=items.filter(l=>l.erledigt).sort((a,b)=>(a.um||0)-(b.um||0));
    html+=`<div class="scard"><div class="shead"><b>${esc(g.name)}</b>${open.length?`<span class="cnt">${open.length}</span>`:''}<span style="flex:1"></span><button class="del" data-del="${g.id}" title="Geschäft löschen">🗑</button></div>
      ${open.map(listRow).join('')}${done.map(listRow).join('')}
      ${done.length?`<button class="btn" data-fin="${g.id}" style="margin-top:6px;padding:10px">Einkauf abschließen (${done.length})</button>`:''}
      <div class="add" style="margin-top:6px"><input data-xq="${g.id}" placeholder="Artikel hinzufügen…" autocomplete="off" value="${xq?.id===g.id?esc(xq.text):''}"></div>`;
    if(xq?.id===g.id&&xq.text){
      const q=xq.text.toLowerCase(), f=freq();
      const hits=data.katalog.filter(p=>label(p).toLowerCase().includes(q)).sort((a,b)=>((b.geschaeft===g.id)-(a.geschaeft===g.id))||((f[b.id]||0)-(f[a.id]||0))).slice(0,8);
      html+=`<div style="margin-top:6px">${hits.map(prow).join('')}<button class="btn sec" data-xnew="${g.id}" style="margin-top:4px;padding:10px">＋ „${esc(xq.text)}“ neu für ${esc(g.name)}</button></div>`;
    }
    html+=`</div>`;
  }
  if(!EXTRAS().length) html+=`<div class="empty">Noch keine weiteren Geschäfte.</div>`;
  html+=addingShop?`<div class="scard"><div class="add"><input id="newShop" placeholder="Name des Geschäfts" autocomplete="off"><button class="scanb" id="newShopOk" title="Anlegen" style="font-size:20px">✓</button></div><button class="btn sec" id="newShopX" style="padding:10px;margin-top:6px">Abbrechen</button></div>`
    :`<button class="btn sec" id="addShop">＋ Geschäft hinzufügen</button>`;
  $('#main').innerHTML=html;
  bindList(); bindRows();
  const m=$('#main');
  m.querySelectorAll('[data-fin]').forEach(b=>b.onclick=()=>finish(b.dataset.fin));
  m.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteShop(b.dataset.del));
  m.querySelectorAll('[data-xnew]').forEach(b=>b.onclick=()=>{newShopDefault=b.dataset.xnew;query=xq.text;newProduct();query='';xq=null});
  m.querySelectorAll('[data-xq]').forEach(inp=>inp.oninput=()=>{xq={id:inp.dataset.xq,text:inp.value};render();const n=$(`[data-xq="${inp.dataset.xq}"]`);n.focus();n.setSelectionRange(n.value.length,n.value.length)});
  $('#addShop')&&($('#addShop').onclick=()=>{addingShop=true;render();$('#newShop').focus()});
  $('#newShopX')&&($('#newShopX').onclick=()=>{addingShop=false;render()});
  const mk=()=>{const name=$('#newShop').value.trim();if(!name)return;addingShop=false;
    const id=name.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,20)+'-'+Date.now().toString(36).slice(-4);
    change('Neues Geschäft: '+name,d=>{if(!d.geschaefte.some(g=>g.id===id))d.geschaefte.push({id,name})})};
  $('#newShopOk')&&($('#newShopOk').onclick=mk);
  $('#newShop')&&($('#newShop').onkeydown=e=>{if(e.key==='Enter')mk()});
}
function deleteShop(id){
  const n=data.katalog.filter(p=>p.geschaeft===id).length, open=shopItems(id).length;
  const msg=`Geschäft „${shopName(id)}“ löschen?`+(open?`\n${open} Einträge auf der Liste werden entfernt.`:'')+(n?`\n${n} Produkte verlieren ihre Zuordnung (die App fragt dann beim nächsten Mal nach dem Geschäft).`:'');
  if(!confirm(msg)) return;
  change('Geschäft gelöscht: '+shopName(id),d=>{
    const ids=new Set(d.katalog.filter(p=>p.geschaeft===id).map(p=>p.id));
    d.liste=d.liste.filter(l=>!ids.has(l.id));
    for(const p of d.katalog) if(p.geschaeft===id) p.geschaeft='';
    d.geschaefte=d.geschaefte.filter(g=>g.id!==id);
    if(d.reihenfolge) delete d.reihenfolge[id];
  });
}
function render(){
  if(!cfg){renderSetup();return}
  if(!data) return;
  if(!shop||!CORE.includes(shop)) shop='edeka';
  markSeen();
  renderTabs();
  if(view==='home') return renderHome();
  if(view==='group') return renderGroup();
  if(view==='info') return renderInfo();
  if(view==='extra') return renderExtras();
  if(view==='stats') return renderStats();
  const f=freq(), onList=new Set(data.liste.filter(l=>!l.erledigt).map(l=>l.id));
  const cand=data.katalog.filter(p=>p.geschaeft===shop||p.auchBei===shop);
  const score=p=>(f[p.id]||0)*10+(p.favorit?5:0);
  let html=`<div class="seg"><button id="pSearch" class="${panel==='search'?'on':''}">🔍 Suchen / Neu</button><button id="pTop" class="${panel==='top'?'on':''}">⭐ Top-Hits</button></div>`;
  if(panel==='search'){
    html+=`<div class="add"><input id="q" placeholder="Artikel suchen oder neu…" autocomplete="off" value="${esc(query)}"><button class="scanb" id="bScan" title="Barcode scannen">${BC_ICON}</button></div>`;
    if(query){
      const q=query.toLowerCase();
      const hits=cand.filter(p=>label(p).toLowerCase().includes(q)||p.kategorie.toLowerCase().includes(q)).sort((a,b)=>score(b)-score(a)).slice(0,12);
      html+=hits.map(prow).join('')+`<button class="btn sec" data-new="1" style="margin:4px 0 8px">＋ „${esc(query)}“ als neuen Artikel anlegen</button>`;
    }
  }else if(panel==='top'){
    const f2=freq();
    const top=[...cand].sort((a,b)=>score(b)-score(a)||a.name.localeCompare(b.name,'de'));
    html+=`<div class="toplist"><div class="tophead"><span>${esc(data.geschaefte.find(g=>g.id===shop)?.name||'')} – nach Häufigkeit</span><button id="pClose">✕ Schließen</button></div>
      ${top.map(p=>prow(p).replace(/(<div class="prow[^>]*>)/,`$1<span class="hits">${f2[p.id]||''}</span>`)).join('')}
      <button class="btn sec" id="pClose2" style="margin:4px 0 0">Liste schließen</button></div>`;
  }
  const items=shopItems(shop);
  if(!items.length) html+=`<div class="empty">Nichts auf der Liste 🎉</div>`;
  const row=listRow;
  const open=items.filter(l=>!l.erledigt).sort((a,b)=>rankOf(data,shop,prod(a.id))-rankOf(data,shop,prod(b.id)));
  const inCart=items.filter(l=>l.erledigt).sort((a,b)=>(a.um||0)-(b.um||0));
  for(const l of open) html+=row(l);
  if(inCart.length){html+=`<h2>Im Wagen</h2>`;inCart.forEach(l=>html+=row(l))}
  if(items.some(l=>l.erledigt)) html+=`<button class="btn" id="fin">Einkauf abschließen (${items.filter(l=>l.erledigt).length})</button>`;
  $('#main').innerHTML=html;
  bindSearch();
  $('#main').querySelectorAll('[data-add]').forEach(e=>e.onclick=()=>addItem(e.dataset.add));
  bindList();
  $('#fin')&&($('#fin').onclick=()=>finish(shop));
  bindRows();
  $('#pSearch').onclick=()=>{panel=panel==='search'?null:'search';query='';render();if(panel==='search')$('#q').focus()};
  $('#pTop').onclick=()=>{panel=panel==='top'?null:'top';query='';render()};
  ['#pClose','#pClose2'].forEach(k=>$(k)&&($(k).onclick=()=>{panel=null;render();scrollTo(0,0)}));
}
function renderInfo(){
  $('#main').innerHTML=`<div class="setup"><h3 style="margin-top:0">ⓘ Einkaufsliste</h3>
    <p style="color:var(--mute);font-size:14px;margin-top:0">Angemeldet als <b>${esc(cfg.name||'–')}</b></p>
    <label style="display:block;font-size:13px;color:var(--mute);margin:4px 0 6px">App-Design</label>
    <div class="seg" id="iTheme">${[['auto','🌗 Automatisch'],['light','☀️ Hell'],['dark','🌙 Dunkel']].map(([k,t])=>`<button data-th="${k}" class="${(localStorage.getItem(THEME_KEY)||'auto')===k?'on':''}">${t}</button>`).join('')}</div>
    ${myRole==='admin'?`<div id="family" style="margin-top:16px"></div>`:''}
    <button class="btn sec" id="iStats">▤ Statistik</button>
    <button class="btn sec" id="iSync">⟳ Jetzt neu laden</button>
    <button class="btn sec" id="iCfg">⚙︎ Einstellungen / Schlüssel</button>
    <p style="color:var(--mute);font-size:13px;margin-bottom:0">Abgehakte Einkäufe werden eine Stunde nach dem letzten Häkchen automatisch abgeschlossen.</p></div>`;
  $('#iStats').onclick=()=>{view='stats';render()};
  $('#iTheme').querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{localStorage.setItem(THEME_KEY,b.dataset.th);applyTheme(b.dataset.th);render()});
  $('#iSync').onclick=async()=>{await refresh();setStatus('Aktualisiert')};
  $('#iCfg').onclick=renderSetup;
  if(myRole==='admin') renderFamily();
}
/* Einladungen liegen nur auf dem Gerät des Administrators (mit Schlüssel), bis die Person sich angemeldet hat */
const INV_KEY='einkauf.einladungen';
let showInv=null, addingMember=false;
async function renderFamily(){
  const box=$('#family'); if(!box) return;
  const g=data.geraete||{};
  let inv=JSON.parse(localStorage.getItem(INV_KEY)||'[]');
  const hashes=await Promise.all(inv.map(x=>tokHash(x.t)));
  const before=inv.length; inv=inv.filter((x,k)=>!g[hashes[k]]);       // angemeldete fallen raus, Schlüssel wird vergessen
  if(inv.length!==before) localStorage.setItem(INV_KEY,JSON.stringify(inv));
  const reg=Object.entries(g).sort((a,b)=>(a[1].rolle==='admin'?-1:1)-(b[1].rolle==='admin'?-1:1)||a[1].name.localeCompare(b[1].name,'de'));
  box.innerHTML=`<label class="hint" style="display:block;margin-bottom:6px">Nutzer</label>
    ${reg.map(([h,x])=>`<div class="fam"><span>${esc(x.name)} <small class="hint">· ${x.rolle==='admin'?'Administrator · ':''}seit ${x.seit.split('-').reverse().join('.')}</small></span>${x.rolle!=='admin'?`<button data-free="${h}">Gerät freigeben</button>`:(h===myHash&&!addingMember?`<button id="invAdd">＋ Nutzer anlegen</button>`:'')}</div>`).join('')}
    ${inv.length?`<label class="hint" style="display:block;margin:12px 0 6px">Noch nicht angemeldet</label>`:''}
    ${inv.map((x,k)=>`<div class="fam"><span>${esc(x.n)}</span><button data-qr="${k}">${showInv===k?'Code ausblenden':'QR-Code zeigen'}</button><button data-rm="${k}" title="Einladung löschen">🗑</button></div>
      ${showInv===k?`<div class="qrbox"><div class="qr" id="qrInv"></div><small class="hint">Direkt vom Bildschirm scannen lassen – nicht als Foto verschicken.</small></div>`:''}`).join('')}
    ${addingMember?`<div class="fam" style="display:block">
        <label class="hint">Name des neuen Nutzers</label>
        <input id="invName" name="family-member-name" autocomplete="off" data-lpignore="true" data-1p-ignore placeholder="z. B. Johannes" style="width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;margin:2px 0 8px">
        <label class="hint">Schlüssel dieser Person</label>
        <input id="invTok" name="family-member-key" type="text" autocomplete="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore placeholder="github_pat_…" autocapitalize="off" style="width:100%;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:8px;margin:2px 0 8px;-webkit-text-security:disc">
        <div class="row"><button class="btn sec" id="invX" style="margin:0;padding:10px">Abbrechen</button><button class="btn" id="invGo" style="margin:0;padding:10px">Anlegen</button></div></div>`
      :''}`;
  box.querySelectorAll('[data-free]').forEach(b=>b.onclick=()=>{
    const h=b.dataset.free, n=g[h]?.name;
    if(!confirm(`Gerät von ${n} freigeben?\nDer Schlüssel kann danach auf einem neuen Gerät angemeldet werden.`))return;
    change('Gerät freigegeben: '+n,d=>{if(d.geraete)delete d.geraete[h]});
  });
  box.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>{const k=+b.dataset.qr;showInv=showInv===k?null:k;renderFamily()});
  box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const k=+b.dataset.rm;if(!confirm(`Einladung für ${inv[k].n} löschen?`))return;inv.splice(k,1);localStorage.setItem(INV_KEY,JSON.stringify(inv));showInv=null;renderFamily()});
  if(showInv!==null&&inv[showInv]){const x=inv[showInv];qrInto('#qrInv',APP_URL+'#invite='+btoa(unescape(encodeURIComponent(JSON.stringify({n:x.n,o:cfg.owner,r:cfg.repo,p:cfg.path,t:x.t})))))}
  $('#invAdd')&&($('#invAdd').onclick=async()=>{addingMember=true;await renderFamily();$('#invName').value='';$('#invTok').value='';setTimeout(()=>{$('#invName').value='';$('#invTok').value='';$('#invName').focus()},150)});
  $('#invX')&&($('#invX').onclick=()=>{addingMember=false;renderFamily()});
  $('#invGo')&&($('#invGo').onclick=async()=>{
    const n=$('#invName').value.trim(), t=clean($('#invTok').value);
    if(!n||!t){setStatus('⚠︎ Bitte Name und Schlüssel eintragen');return}
    if(g[await tokHash(t)]){setStatus('⚠︎ Dieser Schlüssel ist schon angemeldet');return}
    inv.push({n,t});localStorage.setItem(INV_KEY,JSON.stringify(inv));addingMember=false;showInv=inv.length-1;renderFamily();
  });
}
const APP_URL=location.protocol==='https:'?location.origin+location.pathname.replace(/index\.html$/,''):'https://ntsv2014.github.io/einkaufsliste/';
async function qrInto(sel,text){
  try{
    await new Promise((ok,no)=>{if(window.qrcode)return ok();const sc=document.createElement('script');sc.src='qrcode.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
    const q=qrcode(0,'M'); q.addData(text); q.make();
    const el=$(sel); if(el) el.innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true});
  }catch{const el=$(sel);if(el)el.textContent='QR-Code nicht verfügbar'}
}
function renderStats(){
  if(!data) return;
  const f=freq();
  const rows=data.katalog.map(p=>({p,n:f[p.id]||0,d:lastBought(p.id)})).sort((a,b)=>b.n-a.n);
  const never=rows.filter(r=>!r.n).length;
  $('#main').innerHTML=`<div class="setup stats"><h3 style="margin-top:0">▤ Statistik</h3>
    <p style="color:var(--mute);font-size:14px">${data.katalog.length} Produkte · ${data.liste.filter(l=>!l.erledigt).length} offen auf den Listen · ${data.historie.length} Käufe erfasst · ${never} Produkte noch nie gekauft</p>
    <label class="hint" style="display:block;margin:10px 0 4px">Kaufhäufigkeit</label>
    ${rows.filter(r=>r.n).map(r=>`<div><span>${esc(label(r.p))}</span><span>${r.n}× · ${r.d.split('-').reverse().join('.')}</span></div>`).join('')||'<p>Noch keine abgeschlossenen Einkäufe.</p>'}
    <button class="btn sec" id="back">Zurück</button></div>`;
  $('#back').onclick=()=>{view='info';render()};
}
function renderSetup(){
  $('#tabs').innerHTML='';
  const c=cfg||{owner:'',repo:'einkaufsliste-daten',path:'liste.json',token:'',name:''};
  $('#main').innerHTML=`<div class="setup"><h3 style="margin-top:0">Einrichtung</h3>
    <p style="font-size:14px;color:var(--mute)">Einmal pro Gerät. Der Schlüssel bleibt nur in diesem Browser gespeichert.</p>
    <label>Dein Name</label><input id="sName" value="${esc(c.name)}" placeholder="z. B. Ingo">
    <label>GitHub-Benutzer / Organisation</label><input id="sOwner" value="${esc(c.owner)}" autocapitalize="off">
    <label>Repository</label><input id="sRepo" value="${esc(c.repo)}" autocapitalize="off">
    <label>Datei</label><input id="sPath" value="${esc(c.path)}" autocapitalize="off">
    <label>Schlüssel (Fine-grained Token)</label><input id="sToken" type="password" value="${esc(c.token)}" autocapitalize="off" placeholder="github_pat_…">
    <button class="btn" id="sGo">Verbinden</button>
    ${cfg?'<button class="btn sec" id="sOut">Schlüssel von diesem Gerät entfernen</button>':''}
    <div class="err" id="sErr"></div></div>`;
  $('#sGo').onclick=async()=>{
    cfg={name:$('#sName').value.trim(),owner:cleanName($('#sOwner').value),repo:cleanName($('#sRepo').value),path:clean($('#sPath').value).replace(/^\/+/,'')||'liste.json',token:clean($('#sToken').value)};
    const miss=[['GitHub-Benutzer',cfg.owner],['Repository',cfg.repo],['Schlüssel',cfg.token]].filter(x=>!x[1]).map(x=>x[0]);
    if(miss.length){$('#sErr').textContent='Bitte ausfüllen: '+miss.join(', ');cfg=null;return}
    $('#sErr').textContent='Verbinde…';
    try{await load();await checkDevice();localStorage.setItem(LS,JSON.stringify(cfg));shop=null;view='home';render();setStatus('Verbunden')}
    catch(e){if(e.message==='BLOCKED')return renderBlocked();const d=await diagnose();$('#sErr').textContent=e.message+'\n\n'+d;cfg=null}
  };
  $('#sOut')&&($('#sOut').onclick=()=>{localStorage.removeItem(LS);cfg=null;data=null;renderSetup()});
}

document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
/* nur lokale Prüfung (ohne Netz), ob ein Einkauf automatisch abgeschlossen werden muss */
setInterval(()=>{if(!document.hidden&&!busy)autoFinish()},5*60*1000);
/* Einladungs-Link: App fertig einrichten, Schlüssel sofort aus der Adresse entfernen */
(()=>{
  const m=location.hash.match(/invite=([^&]+)/); if(!m) return;
  history.replaceState(null,'',location.pathname+location.search);
  try{
    const v=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    cfg={name:v.n,owner:v.o,repo:v.r,path:v.p||'liste.json',token:v.t};
    localStorage.setItem(LS,JSON.stringify(cfg)); setTimeout(()=>setStatus('Willkommen, '+v.n+'!'),800);
  }catch{setTimeout(()=>setStatus('⚠︎ Einladungs-Code ungültig'),500)}
})();
cfg?refresh():renderSetup();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
